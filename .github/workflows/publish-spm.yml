name: Central Publish SPM
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [publish-spm]

# Queue publishes, never cancel one. A publish is not idempotent partway through: the job
# pushes the xcframework to the SPM branch and creates tag v<new_version> BEFORE committing the
# bumped VERSION back to the source repo. Cancelled between those two pushes, the tag exists but
# VERSION does not advance, so the next run recomputes the same version and dies on "tag already
# exists" — every later publish fails until someone bumps VERSION or deletes the tag by hand.
# That exact failure has happened before, from a different cause; see the comment on the
# "Commit version bump back to source repo" step below.
#
# cancel-in-progress: true is the right default for CI that only reports on a commit, because a
# newer commit's answer supersedes an older one. It is the wrong default for a job with side
# effects outside its own run. The cost of queueing is a slower publish when pushes come fast;
# the cost of cancelling is a stuck pipeline needing manual repair.
concurrency:
  group: publish-spm-${{ github.event.client_payload.repo }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (source repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Extract SPM owner/repo
        id: spm_repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.spm_repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (SPM repo)
        id: spm-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.spm_repo.outputs.owner }}
          repositories: ${{ steps.spm_repo.outputs.name }}

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      # Which source commit this artifact actually came from.
      #
      # The checkout above takes `ref: <branch>`, not a SHA, so the commit this job BUILDS is
      # whatever the branch head is when the job starts -- not necessarily the commit whose push
      # dispatched it. Recording only the dispatcher's SHA would therefore sometimes name a commit
      # that was never built, which is the exact error this exists to remove. Record both, and say
      # so when they differ rather than quietly picking one.
      - name: Resolve built source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BUILT="$(git rev-parse HEAD)"
          echo "sha=$BUILT" >> "$GITHUB_OUTPUT"
          REQUESTED="${{ github.event.client_payload.source_sha }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$BUILT" ]; then
            echo "::warning::publish raced a push: requested $REQUESTED, building $BUILT"
          fi

      - name: Fetch local.properties from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Local-Properties
          export-type: file
          file-output-path: /local.properties

      - name: Clean local.properties
        run: sed -i -e "s/'//g" local.properties

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Increment version
        id: version
        run: bash ./increment_version.sh

      # The iOS framework links ANGLE, whose binary is fetched from a release asset rather
      # than committed (it is 24 MB and iOS-only). Source repos are private, so that fetch
      # needs a token; the app token minted above is already scoped to the source repo the
      # release lives on. Without this the build fails in :downloadAngle with
      # "No GitHub token available to fetch ANGLE".
      - name: Build XCFramework
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./gradlew assembleTASharedReleaseXCFramework

      - name: Checkout SPM repo
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.spm_repo }}
          ref: ${{ github.event.client_payload.spm_branch || 'main' }}
          token: ${{ steps.spm-token.outputs.token }}
          path: spm-repo
          fetch-depth: 1

      - name: Remove existing XCFramework
        run: rm -rf spm-repo/TAShared.xcframework

      - name: Copy XCFramework to SPM repo
        run: cp -r build/XCFrameworks/release/TAShared.xcframework spm-repo/TAShared.xcframework

      # TAShared links @rpath/libEGL.framework/libEGL and @rpath/libGLESv2.framework/libGLESv2
      # (ANGLE, its GLES 3.0 implementation). Publishing TAShared alone produced a package that
      # links but dies in dyld at launch, because nothing ships those two frameworks. They are
      # fetched into build/angle/<revision>/ by the :downloadAngle task the framework build runs,
      # so copy them alongside — and let the publish fail loudly if they are missing rather than
      # shipping another unloadable package.
      #
      # Package.swift on the SPM branch must list them as binaryTargets of the TAShared product,
      # or SPM will not embed them into the consuming app.
      - name: Copy ANGLE frameworks to SPM repo
        run: |
          set -euo pipefail
          angle_dir="$(find build/angle -mindepth 1 -maxdepth 1 -type d | head -1)"
          if [ -z "$angle_dir" ]; then
            echo "::error::No ANGLE artifact under build/angle — did :downloadAngle run?"
            exit 1
          fi
          for fw in libEGL libGLESv2; do
            if [ ! -d "$angle_dir/$fw.xcframework" ]; then
              echo "::error::$angle_dir/$fw.xcframework is missing"
              exit 1
            fi
            rm -rf "spm-repo/$fw.xcframework"
            cp -R "$angle_dir/$fw.xcframework" "spm-repo/$fw.xcframework"
          done
          echo "Published ANGLE from $angle_dir"

      # ANGLE's generated framework plists carry CFBundleVersion but omit the
      # short version App Store Connect requires (error 90057). Normalize the
      # copied SPM payload, leaving the pinned upstream archive byte-for-byte
      # intact so its provenance checksum still describes the downloaded input.
      - name: Normalize ANGLE framework metadata
        run: |
          curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/normalize_framework_metadata.py |
            python3 - spm-repo/libEGL.xcframework spm-repo/libGLESv2.xcframework

      # A consumer pinned at a revision on the SPM branch reads the source commit out of the
      # checkout itself, instead of pairing workflow run timestamps against publish times and then
      # checking whether some symbol is present in the published header.
      #
      # Its own file rather than a header comment in Package.swift on purpose: that file carries
      # the load-bearing ANGLE binaryTarget declarations, and a workflow that rewrites it is a way
      # to lose the two frameworks that stop a consuming app dying in dyld.
      #
      # Intentional side effect: this file changes every run, so the commit below always has
      # something to commit. Previously a publish whose framework bytes happened to be identical
      # produced no commit and therefore no tag, while `increment_version.sh` had already burned
      # the version -- the same stuck state the concurrency comment above describes, reached from
      # the other side. This removes it.
      - name: Record provenance in SPM repo
        shell: bash
        env:
          PROV_VERSION: ${{ steps.version.outputs.new_version }}
          PROV_SOURCE_REPO: ${{ github.event.client_payload.repo }}
          PROV_SOURCE_BRANCH: ${{ github.event.client_payload.branch }}
          PROV_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          PROV_REQUESTED_COMMIT: ${{ github.event.client_payload.source_sha }}
          PROV_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Values go through the environment, not string interpolation, so a branch name
          # containing a quote cannot break the JSON or the surrounding shell.
          python3 - > spm-repo/PROVENANCE.json <<'PY'
          import datetime, json, os
          print(json.dumps({
              "version": os.environ["PROV_VERSION"],
              "source_repo": os.environ["PROV_SOURCE_REPO"],
              "source_branch": os.environ["PROV_SOURCE_BRANCH"],
              "source_commit": os.environ["PROV_SOURCE_COMMIT"],
              "requested_commit": os.environ.get("PROV_REQUESTED_COMMIT", ""),
              "published_at": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "publish_run": os.environ["PROV_RUN"],
          }, indent=2))
          PY

      - name: Commit XCFramework
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: spm-repo
          tag_name: v${{ steps.version.outputs.new_version }}
          # Subject line deliberately unchanged, so anything matching `Update to v<version>`
          # keeps working; the provenance rides in the body as trailers.
          commit_message: |
            Update to v${{ steps.version.outputs.new_version }}

            Source-Repo: ${{ github.event.client_payload.repo }}
            Source-Branch: ${{ github.event.client_payload.branch }}
            Source-Commit: ${{ steps.source.outputs.sha }}
            Requested-Commit: ${{ github.event.client_payload.source_sha }}
            Publish-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: ${{ github.event.client_payload.spm_branch || 'main' }}

      # `increment_version.sh` bumps gradle.properties in the SOURCE checkout, but
      # nothing committed it, so VERSION never advanced and every run after the first
      # recomputed the same version and died on `tag already exists`. Write it back so
      # the version genuinely moves. Runs after the SPM commit, so a failed build never
      # burns a version number.
      #
      # `[skip ci]` is load-bearing: source repos trigger this workflow on push to their
      # default branch, so an unmarked bot commit here would dispatch another publish and
      # loop indefinitely.
      - name: Commit version bump back to source repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump SPM version to v${{ steps.version.outputs.new_version }} [skip ci]"
          branch: ${{ github.event.client_payload.branch }}
          file_pattern: gradle.properties
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
