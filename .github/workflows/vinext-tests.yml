name: Vinext Deployment Tests

on:
  pull_request:
    paths: ['scripts/vinext/**', 'data/vinext-projects.json', '.github/workflows/vinext-*.yml', 'triggers/vinext-trigger.yml']
  push:
    branches: [main]
    paths: ['scripts/vinext/**', 'data/vinext-projects.json', '.github/workflows/vinext-*.yml', 'triggers/vinext-trigger.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test scripts/vinext/*.test.mjs
