name: Central Build & Release iOS
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [release-ios]

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.event.client_payload.repo }}
  cancel-in-progress: true

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.repo.outputs.owner }}
      name: ${{ steps.repo.outputs.name }}
      app_name: ${{ steps.app_meta.outputs.app_name }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Extract owner/repo
        id: repo
        shell: "seal-bash {0}"
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}

      - name: Checkout target repo @ branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: refs/heads/${{ github.event.client_payload.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git for private SPM dependencies
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "${APP_TOKEN:-}" ]; then echo "::add-mask::${APP_TOKEN}"; fi
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Extract version and app metadata
        id: version
        shell: "seal-bash {0}"
        run: |
          VERSION=$(grep 'MARKETING_VERSION' *.xcodeproj/project.pbxproj | grep -v '1.0' | head -1 | sed 's/.*= //;s/;//;s/ //g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract app metadata
        id: app_meta
        shell: "seal-bash {0}"
        run: |
          APP_NAME=$(grep -m1 'PRODUCT_NAME' *.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/"//g;s/ //g' || echo "TravelRoute")
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Capture Xcode version
        id: xcode-version
        shell: "seal-bash {0}"
        run: |
          version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/ $//')"
          key="$(printf '%s' "$version" | shasum -a 256 | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache-key=$key"   >> "$GITHUB_OUTPUT"

      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env

      - name: Detect Xcode project
        id: detect
        shell: "seal-bash {0}"
        run: |
          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1 | sed 's|^\./||')
          SCHEME=$(echo "$XCODEPROJ" | sed 's/.xcodeproj//')
          echo "project=$XCODEPROJ" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"     >> "$GITHUB_OUTPUT"

      - name: Decode GoogleService-Info.plist
        shell: "seal-bash {0}"
        env:
          XCODE_SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          if [ -n "${XCODE_SCHEME:-}" ]; then echo "::add-mask::${XCODE_SCHEME}"; fi
          if [ -n "${SERVICE_PLIST_BASE64:-}" ]; then echo "::add-mask::${SERVICE_PLIST_BASE64}"; fi
          PLIST_PATH=$(find . -path "*/GoogleService-Info.plist" -not -path "*/Pods/*" -not -path "*/.build/*" 2>/dev/null | head -1)
          if [ -z "$PLIST_PATH" ]; then
            PLIST_PATH="${XCODE_SCHEME}/GoogleService-Info.plist"
          fi
          echo "${SERVICE_PLIST_BASE64}" | base64 --decode > "$PLIST_PATH"

      - name: Install Apple certificate and provisioning profiles
        run: curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/install_apple_cert.sh | bash

      - name: Install additional provisioning profiles
        shell: "seal-bash {0}"
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -n "$IOS_SHARE_EXT_PROVISION_PROFILE_BASE64" ]; then
            TEMP_PROFILE=$(mktemp)
            echo "$IOS_SHARE_EXT_PROVISION_PROFILE_BASE64" | base64 --decode > "$TEMP_PROFILE"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
              <<< "$(security cms -D -i "$TEMP_PROFILE")")
            cp "$TEMP_PROFILE" "$PROFILES_DIR/$UUID.mobileprovision"
            rm -f "$TEMP_PROFILE"
            echo "SHARE_EXT_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
            echo "Installed share extension profile with UUID $UUID"
          fi

      - name: Switch Xcode project to manual signing
        env:
          PBXPROJ_PATH: ${{ steps.detect.outputs.project }}/project.pbxproj
        run: curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/fix_ios_signing.py | python3 -

      - name: Generate ExportOptions.plist
        shell: "seal-bash {0}"
        run: |
          if [ -n "${IOS_TEAM_ID:-}" ]; then echo "::add-mask::${IOS_TEAM_ID}"; fi
          if [ -n "${IOS_BUNDLE_ID:-}" ]; then echo "::add-mask::${IOS_BUNDLE_ID}"; fi
          if [ -n "${APP_PROFILE_UUID:-}" ]; then echo "::add-mask::${APP_PROFILE_UUID}"; fi
          if [ -n "${NSE_PROFILE_UUID:-}" ]; then echo "::add-mask::${NSE_PROFILE_UUID}"; fi
          if [ -n "${SHARE_EXT_PROFILE_UUID:-}" ]; then echo "::add-mask::${SHARE_EXT_PROFILE_UUID}"; fi
          if [ -n "${WIDGET_PROFILE_BUNDLE_ID:-}" ]; then echo "::add-mask::${WIDGET_PROFILE_BUNDLE_ID}"; fi
          if [ -n "${WIDGET_PROFILE_UUID:-}" ]; then echo "::add-mask::${WIDGET_PROFILE_UUID}"; fi
          /usr/libexec/PlistBuddy -c "Clear dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string ${IOS_TEAM_ID}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${IOS_BUNDLE_ID} string ${APP_PROFILE_UUID}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${IOS_BUNDLE_ID}.OneSignalNotificationServiceExtension string ${NSE_PROFILE_UUID}" ExportOptions.plist
          if [ -n "${SHARE_EXT_PROFILE_UUID}" ]; then
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${IOS_BUNDLE_ID}.MapLinkShareExtension string ${SHARE_EXT_PROFILE_UUID}" ExportOptions.plist
          fi
          if [ -n "${WIDGET_PROFILE_BUNDLE_ID}" ] && [ -n "${WIDGET_PROFILE_UUID}" ]; then
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${WIDGET_PROFILE_BUNDLE_ID} string ${WIDGET_PROFILE_UUID}" ExportOptions.plist
          fi

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode-version.outputs.cache-key }}-${{ hashFiles('*.xcodeproj/project.pbxproj', '**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode-version.outputs.cache-key }}-
            spm-${{ runner.os }}-

      - name: Resolve SPM dependencies
        env:
          XCODE_SCHEME: ${{ steps.detect.outputs.scheme }}
          XCODE_PROJECT: ${{ steps.detect.outputs.project }}
        run: |
          if [ -n "${XCODE_SCHEME:-}" ]; then echo "::add-mask::${XCODE_SCHEME}"; fi
          if [ -n "${XCODE_PROJECT:-}" ]; then echo "::add-mask::${XCODE_PROJECT}"; fi
          xcodebuild -resolvePackageDependencies \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Archive
        env:
          XCODE_SCHEME: ${{ steps.detect.outputs.scheme }}
          XCODE_PROJECT: ${{ steps.detect.outputs.project }}
        run: |
          if [ -n "${XCODE_SCHEME:-}" ]; then echo "::add-mask::${XCODE_SCHEME}"; fi
          if [ -n "${XCODE_PROJECT:-}" ]; then echo "::add-mask::${XCODE_PROJECT}"; fi
          xcodebuild archive \
            -project "${XCODE_PROJECT}" \
            -scheme "${XCODE_SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \

      - name: Validate embedded framework metadata
        run: |
          curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/normalize_framework_metadata.py |
            python3 - --check build/App.xcarchive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \

      - name: Upload dSYMs to Firebase Crashlytics
        shell: "seal-bash {0}"
        run: |
          UPLOAD_SYMBOLS=$(find SourcePackages -name "upload-symbols" -type f | head -1)
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "Warning: upload-symbols not found, skipping dSYM upload"
            exit 0
          fi
          chmod +x "$UPLOAD_SYMBOLS"

          PLIST=$(find . -name "GoogleService-Info.plist" -not -path "*/Pods/*" -not -path "*/.build/*" | head -1)

          "$UPLOAD_SYMBOLS" -gsp "$PLIST" -p ios build/App.xcarchive/dSYMs

      - name: Seal IPA artifact
        id: pack_1
        run: |
          seal-pack ios-release 'build/ipa/*.ipa'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: ${{ runner.temp }}/seal/art/ios-release/
          retention-days: 7

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-release

      - name: Unseal IPA artifact
        run: seal-unpack .
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}

      - name: Locate IPA
        id: assets
        shell: "seal-bash {0}"
        run: |
          set -euo pipefail
          IPA=$(find . -maxdepth 2 -name "*.ipa" | head -n 1)
          : "${IPA:?Missing IPA}"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
          xcrun altool --upload-app \
            -f "${{ steps.assets.outputs.ipa }}" \
            --type ios \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Create PostHog annotation
        if: github.event.client_payload.posthog_project_id != ''
        shell: "seal-bash {0}"
        env:
          POSTHOG_PROJECT_ID: ${{ github.event.client_payload.posthog_project_id }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          if [ -n "${POSTHOG_PROJECT_ID:-}" ]; then echo "::add-mask::${POSTHOG_PROJECT_ID}"; fi
          if [ -n "${APP_VERSION:-}" ]; then echo "::add-mask::${APP_VERSION}"; fi
          set -euo pipefail
          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $POSTHOG_API_KEY" \
            "https://us.posthog.com/api/projects/${POSTHOG_PROJECT_ID}/annotations/" \
            -d "$(jq -n \
              --arg content "iOS ${APP_VERSION} submitted to App Store" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%S%z)" \
              '{content: $content, date_marker: $date, scope: "project"}')"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.build.outputs.owner }}
          repositories: ${{ needs.build.outputs.name }}

      - name: Increment version
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: refs/heads/${{ github.event.client_payload.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1

      - name: Bump version and push
        run: |
          bash increment_version.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xcodeproj/project.pbxproj
          git commit -m "[skip ci] Increment version to $(grep 'MARKETING_VERSION' *.xcodeproj/project.pbxproj | grep -v '1.0' | head -1 | sed 's/.*= //;s/;//;s/ //g')"
          git push origin HEAD:${{ github.event.client_payload.branch }}

      - name: Notify Telegram (success)
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
          TELEGRAM_TOKEN: ${{ secrets.SUBSCRIPTION_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SUBSCRIPTION_TELEGRAM_TO }}
        run: |
          if [ -n "${APP_VERSION:-}" ]; then echo "::add-mask::${APP_VERSION}"; fi
          if [ -n "${APP_NAME:-}" ]; then echo "::add-mask::${APP_NAME}"; fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=html \
            -d disable_web_page_preview=true \
            -d text="$(cat <<MSG
          <b>iOS build submitted to App Store</b>

          <b>App:</b> ${APP_NAME}
          <b>Version:</b> ${APP_VERSION}
          MSG
          )"

      - name: Notify Telegram (FAILURE)
        if: failure()
        continue-on-error: true
        env:
          APP_NAME: ${{ needs.build.outputs.app_name }}
          TELEGRAM_TOKEN: ${{ secrets.SUBSCRIPTION_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SUBSCRIPTION_TELEGRAM_TO }}
        run: |
          if [ -n "${APP_NAME:-}" ]; then echo "::add-mask::${APP_NAME}"; fi
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=html \
            -d disable_web_page_preview=true \
            -d text="$(cat <<MSG
          <b>App Store publish failed</b>

          <b>App:</b> ${APP_NAME}
          <b>Repo:</b> <code>${{ github.event.client_payload.repo }}</code>

          <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
          MSG
          )"

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
