name: App Store Connect build status
# Read-only diagnostic: recent builds of one app, their processing state and TestFlight groups.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: App bundle ID
        required: true
        default: com.travelanimator.routemap.debug
        type: string
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
      - run: pip install --quiet 'pyjwt[crypto]==2.10.1'
      - run: python3 scripts/ios/asc_build_status.py --bundle-id "$BUNDLE_ID"
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
