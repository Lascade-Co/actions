name: Central Publish travel-animator to PyPI
run-name: "travel-animator → pypi @ ${{ inputs.sha }}"

# Publishes the PUBLIC TADA distribution, `travel-animator` (render engine and safe CLI). Its
# Python import path is `tada_render`, so the wheel is globbed by `travel_animator-` while its
# modules live under `tada_render/`.
#
# Manual only, deliberately. PyPI releases are immutable: a version can be uploaded exactly
# once and never replaced, so this must not fire on every push to tada's main the way
# publish-tada-wheel.yml does -- that would fail on the second push of any given version.
# Publishing is gated on a version bump, which is a human decision.
#
# Auth is a stored API token (PIPY_TOKEN). A PyPI Trusted Publisher (OIDC) would avoid holding
# a long-lived credential at all and is worth revisiting, but the token is what exists today.
#
# The private `tada` wheel is built here too (one build path for both distributions) but is
# never uploaded; stage_public_wheel.sh enforces that. That wheel carries `ta-prepare.jar`
# (ADR 0015) -- ta-render.jar plus the sealed `builder/` package -- which is precisely why it
# must not be: this workflow's output goes to a public index.
#
# ---------------------------------------------------------------------------------------------
# `travel-animator` became a PLATFORM wheel when it started carrying the JVM renderer payload
# (backlog C1), and this workflow publishes FOUR of them -- linux-x64 (manylinux_2_28),
# linux-arm64 (manylinux_2_34; capped by LWJGL's aarch64 native), macos-arm64 and windows-x64.
# The matrix is `_tada-wheels.yml`, shared with publish-tada-wheel.yml so the pinned ANGLE
# digests exist in exactly one file.
#
# It used to build only the pure `py3-none-any` wheel and fail at staging, on purpose: a
# `py3-none-any` file on PyPI is what every platform we did NOT build resolves to, it carries
# no payload, and a PyPI release is IMMUTABLE -- yankable, never replaceable. That guard is
# still there (`EXPECT_WHEELS: 4` plus stage_public_wheel.sh's refusal of `any`); what changed
# is that the four wheels it wants now exist.
#
# Still owed: a PyPI per-file size-limit increase if these keep growing (backlog C7). Measured
# 2026-08-12 they are 80-83 MB against a 100 MB default -- fine, but the JRE is what grows.
# ---------------------------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character tada commit SHA to publish from
        required: true
        type: string

concurrency:
  group: publish-tacli-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Everything that can refuse the release before a runner-minute is spent on wheels, plus the
  # jar the matrix folds into all four of them.
  validate:
    name: Tests and jars
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Must match publish-tada-wheel.yml: the jar cache key is shared between the two paths.
      JAVA_VERSION: "21"
    outputs:
      dist: ${{ steps.publishable.outputs.dist }}
      version: ${{ steps.publishable.outputs.version }}
      shared_revision: ${{ steps.shared.outputs.revision }}
    steps:
      - name: Validate the requested revision
        run: |
          if [[ ! "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co
          repositories: |
            tada
            travel-animator-shared

      - name: Check out TADA @ requested commit
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/tada
          ref: ${{ inputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Gate before the expensive build: a version already on the index should fail in
      # seconds rather than after a full test run and four wheel legs.
      - name: Verify travel-animator is publishable
        id: publishable
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_tacli_publishable.py -o "$RUNNER_TEMP/verify_tacli_publishable.py"
          python3 "$RUNNER_TEMP/verify_tacli_publishable.py" \
            --pyproject tada_render/pyproject.toml

      # Same key as publish-tada-wheel.yml's jvm-build, so the jars this release ships are the
      # ones the push-to-main run already built for this commit rather than a second build of
      # the same sources. Cache scope is the default branch, which both paths run on.
      - name: Compute the JAR cache key
        id: keys
        env:
          SOURCES: ${{ hashFiles('host/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**') }}
          SHARED: ${{ steps.shared.outputs.revision }}
        run: echo "jars=ta-jars-v1-${{ runner.os }}-jdk${JAVA_VERSION}-${SHARED}-${SOURCES}" >> "$GITHUB_OUTPUT"

      - name: Restore the built JARs
        id: jars-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            host/build/libs
            host/build/reports/ta-jars
          key: ${{ steps.keys.outputs.jars }}

      # Kept byte-identical to publish-tada-wheel.yml's list on purpose -- the wheels uploaded
      # here are built by the same script, on the same runner image, and a GL stack that differs
      # between the two paths is a difference nobody would notice until a release. Two client
      # APIs, one Mesa stack:
      #   * moderngl binds EGL_OPENGL_API -- DESKTOP GL, linking libGL.so.1  -> libegl1 + libgl1
      #   * the KMP/JVM renderer binds EGL_OPENGL_ES_API and resolves
      #     libGLESv2.so.2 at runtime via dlopen                             -> libgles2
      # libgles2 is the addition that matters: nothing else here pulls it in, and its absence
      # makes GLES tests SKIP rather than fail. libegl-mesa0 is Mesa's EGL vendor library behind
      # the vendor-neutral libegl1 loader -- only a `Recommends:`, and this install passes
      # --no-install-recommends, so it has been surviving on the runner image's preinstalled set
      # rather than on anything we asked for. libgl1-mesa-dri is the llvmpipe Gallium driver
      # that rasterizes for both APIs on a GPU-less runner.
      - name: Install headless OpenGL/GLES runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri

      # Gradle is here for the two jars and nothing else; publish-tada-wheel.yml is where
      # :shared:jvmTest runs. tada + shared -- both checked out above -- are the whole build,
      # because rentile resolves from Maven Central.
      # Unconditional: the tests below also run the RESTORED jar, so a cache hit still
      # needs a JVM. Skipping it left them on the runner's Java 17 against Java 21
      # bytecode. Only Gradle is cache-conditional.
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # cache-encryption-key is what lets gradle/actions persist the configuration cache across
      # runs; without it the entry is stored every run and reused never.
      - name: Setup Gradle
        if: steps.jars-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --all-packages --all-extras is load-bearing: grpcio-tools (protoc codegen) and the
      # mcp SDK are declared on the tada_render member, not the workspace root. A plain
      # `uv sync --locked` installs neither, so codegen and the MCP server tests fail --
      # and `travel-animator mcp` is part of what ships, so those tests must run before publishing.
      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      # TADA_PREPARE_JAVA is the first rung of prepare_bridge's java ladder, so this
      # decides which JVM runs the jar rather than leaving it to PATH.
      - name: Run tests from the lockfile
        run: |
          export TADA_PREPARE_JAVA="$JAVA_HOME/bin/java"
          uv run --locked --all-packages --all-extras pytest

      - name: Make gradlew executable
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: chmod +x gradlew

      # verifyTaRenderJarSeal is the ADR 0006/0007 gate: no com/lascade/ta/shared/builder/**
      # class in the jar the public wheels ship. Re-checked by verify_tada_wheel.py on the jar
      # inside each finished wheel, which is also what keeps the gate honest on a cache hit.
      - name: Build the two JARs and verify the builder seal
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: ./gradlew :host:taJars

      # The matrix downloads this. A jar is a zip, so upload-artifact stripping modes is moot.
      - name: Upload ta-render.jar
        uses: actions/upload-artifact@v7
        with:
          name: ta-render-jar
          path: host/build/libs/ta-render.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # A SEPARATE artifact: this is the one carrying the sealed `builder/` package, and only
      # the publish job -- which builds the private wheel it goes into -- pulls it.
      - name: Upload ta-prepare.jar
        uses: actions/upload-artifact@v7
        with:
          name: ta-prepare-jar
          path: host/build/libs/ta-prepare.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cache the built JARs
        if: steps.jars-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            host/build/libs
            host/build/reports/ta-jars
          key: ${{ steps.keys.outputs.jars }}

  wheels:
    name: Wheels
    needs: validate
    uses: ./.github/workflows/_tada-wheels.yml
    with:
      repo: Lascade-Co/tada
      sha: ${{ inputs.sha }}
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: [validate, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional protection: if a `pypi` environment is configured, its required reviewers
    # gate the upload and PIPY_TOKEN can be scoped to it. Unconfigured, GitHub auto-creates
    # it unprotected and the token resolves from repository secrets -- dispatch works
    # either way. The token check lives in THIS job for that reason: an environment-scoped
    # secret is not readable from `validate`, so checking it earlier would fail on a
    # correctly configured repository.
    environment: pypi
    permissions:
      contents: read
    steps:
      - name: Require the PyPI API token
        env:
          PYPI_TOKEN: ${{ secrets.PIPY_TOKEN }}
        run: |
          if [[ -z "$PYPI_TOKEN" ]]; then
            echo "PIPY_TOKEN is not set; add it before publishing." >&2
            exit 1
          fi

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co
          repositories: |
            tada
            travel-animator-shared

      - name: Check out TADA @ requested commit
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/tada
          ref: ${{ inputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ needs.validate.outputs.shared_revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      - name: Download ta-prepare.jar
        uses: actions/download-artifact@v8
        with:
          name: ta-prepare-jar
          path: jar

      # All four legs, flattened into one directory. Each artifact also carries its
      # PAYLOAD-<platform>.json, which is provenance rather than a publishable file and is
      # therefore never copied into bundle/.
      - name: Download every platform wheel
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: wheels

      # Reuses the private path's build script so the bytes uploaded here are produced exactly
      # the way the tested GHCR bundle's wheels are -- one build path, not two. That script is
      # deliberately single-platform (it asserts a five-file bundle), so it takes the manylinux
      # x86-64 wheel and the other three are added after it has had its say.
      - name: Assemble the bundle and add the remaining platform wheels
        env:
          SHARED_REVISION: ${{ needs.validate.outputs.shared_revision }}
          TADA_REPOSITORY: Lascade-Co/tada
          TADA_REVISION: ${{ inputs.sha }}
          PREPARE_JAR: jar/ta-prepare.jar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tada-wheel"
          base=https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel
          for name in build_tada_wheel.sh build_prepare_payload.py inject_wheel_payload.py; do
            curl -sSfL "$base/$name" -o "$RUNNER_TEMP/tada-wheel/$name"
          done
          PUBLIC_WHEEL="$(ls wheels/travel_animator-*manylinux*x86_64.whl)" \
            bash "$RUNNER_TEMP/tada-wheel/build_tada_wheel.sh"
          for wheel in wheels/travel_animator-*.whl; do
            cp -n "$wheel" bundle/
          done
          count=$(ls bundle/travel_animator-*.whl | wc -l)
          if (( count != 4 )); then
            echo "expected four public wheels in bundle/, found $count:" >&2
            ls -1 bundle/travel_animator-*.whl >&2
            exit 1
          fi

      # Credentials, required modules, the builder seal re-checked on each shipped jar, the
      # class-file major, the natives layout and the ANGLE rule -- for all four wheels, plus
      # the private one in reverse (its ta-prepare.jar must be present and must carry
      # `builder/`). This is the last check before an immutable public upload.
      - name: Verify wheel contents and JVM payload
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_tada_wheel.py -o "$RUNNER_TEMP/verify_tada_wheel.py"
          uv run --locked python "$RUNNER_TEMP/verify_tada_wheel.py"

      - name: Stage only the public wheels
        env:
          DIST: ${{ needs.validate.outputs.dist }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECT_WHEELS: "4"
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/stage_public_wheel.sh -o "$RUNNER_TEMP/stage_public_wheel.sh"
          bash "$RUNNER_TEMP/stage_public_wheel.sh"

      # attestations are off because they require OIDC (id-token: write), which token auth does
      # not provide; leaving the default on makes the action fail outright.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false

  # --------------------------------------------------------------------------------------------
  # The listing half of a release. `travel-animator` is also an MCP server, listed in the official
  # MCP registry from `server.json` in Lascade-Co/travelanimator-mcp -- and that file names the
  # PyPI version it describes. Left alone it goes stale on the first release nobody hand-edits it
  # for, and a stale listing points installers at an old wheel while claiming to be current.
  #
  # So the bump is made here, where the version that actually reached PyPI is known, and the
  # commit is the trigger: travelanimator-mcp's own publish-mcp-registry.yml runs on a change to
  # server.json and does the registry publish. This job deliberately does NOT publish to the
  # registry itself -- the DNS signing key lives in that repo's environment, and one credential in
  # one place is the point.
  #
  # It runs after `publish`, never beside it: the registry validates that the package version
  # exists on PyPI, so announcing before the upload lands is simply rejected.
  sync-mcp-server-json:
    name: Bump server.json in travelanimator-mcp
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App token (travelanimator-mcp)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Lascade-Co
          repositories: travelanimator-mcp

      # persist-credentials is TRUE here, unlike every other checkout in this file: those are
      # read-only, and this one pushes.
      - name: Check out travelanimator-mcp
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travelanimator-mcp
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # PyPI's JSON API trails the upload by a few seconds. The downstream workflow refuses to
      # publish a version the index cannot serve yet, so pushing the bump too early turns a good
      # release into a spurious red X on another repo's main.
      - name: Wait for PyPI to serve the new version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -sSfL "https://pypi.org/pypi/travel-animator/$VERSION/json" -o /dev/null; then
              echo "PyPI is serving travel-animator $VERSION"
              exit 0
            fi
            echo "attempt $attempt: not visible yet; sleeping 10s"
            sleep 10
          done
          echo "::error::travel-animator $VERSION never became visible on PyPI" >&2
          exit 1

      - name: Bump server.json
        id: bump
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          current="$(jq -r '.version' server.json)"
          if [[ "$current" == "$VERSION" ]]; then
            echo "server.json is already at $VERSION"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Both version fields move together: `.version` is the listing's own, and
          # `.packages[].version` is the PyPI release it points at. The registry rejects a
          # listing whose package version does not exist, so they are never independent.
          jq --arg v "$VERSION" '.version = $v | (.packages[]?.version) = $v' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "bumped $current -> $VERSION"
          git diff --stat server.json

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TADA_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git config user.name  "lascade-ci[bot]"
          git config user.email "lascade-ci[bot]@users.noreply.github.com"
          git add server.json
          git commit -m "Point the MCP listing at travel-animator $VERSION" \
                     -m "Released from tada@${TADA_SHA}. This commit triggers publish-mcp-registry.yml."
          git push origin HEAD:main

      - name: Summary
        if: always()
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "### MCP listing"
            echo
            if [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
              echo "Bumped \`server.json\` to \`$VERSION\` in Lascade-Co/travelanimator-mcp."
              echo "Its publish-mcp-registry workflow takes it from there."
            else
              echo "\`server.json\` was already at \`$VERSION\`; nothing pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
