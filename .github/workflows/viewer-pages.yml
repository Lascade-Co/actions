name: Viewer Pages

# Publishes viewer/ (the sealed log viewer) to GitHub Pages at https://ci.lascade.com.
on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/viewer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-pages
  cancel-in-progress: false

defaults:
  run:
    shell: seal-bash-e {0}

jobs:
  build:
    # Only main may publish code to the origin that holds the repo key.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages site (GET /repos/{repo}/pages).
      pages: read
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v6

      # The public site: the only upload that is not sealed.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer
          retention-days: 7

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
