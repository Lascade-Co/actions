name: Central Publish TADA Wheel
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [publish-tada-wheel]

# The publish job additionally takes a non-cancel group to serialize GHCR mutations, and
# re-checks that the built commit is still main's head before replacing latest -- that
# stale-guard, not this cancellation, is what keeps a superseded commit from being published.
concurrency:
  group: publish-tada-wheel-${{ github.event.client_payload.repo }}
  cancel-in-progress: true

permissions:
  contents: read

# The wheel matrix cannot collapse back into one job (CI doc §4): jlink cannot cross-target,
# macOS ad-hoc signing needs a real macOS runner, and a platform-tagged wheel installs only on
# a matching one. It lives in `_tada-wheels.yml` because PyPI publishes the same four wheels,
# and the ANGLE pins must not exist in two files. `ta-render.jar` is built ONCE here and passed
# as an artifact -- it is architecture-neutral (all six LWJGL classifiers, tada c8dcfec) --
# which keeps Gradle's three-build composite off the other four runners.
#
# `ta-prepare.jar` is built by the same Gradle task and travels the same way, but to ONE
# consumer: the bundle job, which folds it into the PRIVATE wheel (ADR 0015). It is that jar
# plus the sealed `builder/` package, so it must never reach a public wheel, and it needs no
# per-platform work -- it borrows the public wheel's jlink'd JRE instead of shipping one.
#
# First executed end to end on 2026-08-12 (run 31586482741) against tada 345e9f3: all four
# wheel legs green including the Windows GL smoke, and the bundle published to GHCR.
jobs:
  validate-python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      # A runner has no GPU, so pin the software rasterizer rather than trusting Mesa's probe.
      # llvmpipe backs both APIs used here: desktop GL for moderngl, GLES for the JVM renderer.
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # The union of two client APIs: moderngl binds desktop GL (libgl1), the JVM renderer binds
      # GLES and dlopens libGLESv2.so.2 (libgles2). Without libgles2 the JVM GL suite SKIPS
      # rather than fails -- "61 skipped, BUILD SUCCESSFUL", a green run that ran no GL at all.
      # libegl-mesa0 is only a `Recommends:` of libegl1, and this install passes
      # --no-install-recommends.
      - name: Install headless OpenGL/GLES runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --all-packages --all-extras is load-bearing, here and on every `uv run` below:
      # grpcio-tools and the mcp SDK are declared on the tada_render member, not the workspace
      # root, so a plain `uv sync --locked` installs neither and codegen and the MCP tests fail.
      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      # The generator resolves the `shared` submodule relative to the workspace root, so
      # invoking it by path from here is correct.
      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      - name: Run tests from the lockfile
        run: uv run --locked --all-packages --all-extras pytest

  # The jar is architecture-neutral for LWJGL (all six classifiers) but NOT for Skiko:
  # `shared/build.gradle.kts` resolves `skiko-awt-runtime-$hostOs-$hostArch` from the build
  # machine, which is why `build_jvm_payload.py` strips `libskiko-*` from the copy it puts in
  # each wheel and stages the right one beside it (backlog C4).
  jvm-build:
    name: Build ta-render.jar and run the renderer suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      # Interpolated into both setup-java and the jar cache key, so the two cannot drift.
      JAVA_VERSION: "21"
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # No rentile checkout: it resolves from Maven Central, so the dependency cache has it.

      # The jars are a pure function of tada's JVM sources plus the pinned shared revision;
      # :shared:jvmTest is a function of the shared revision alone, so a `host/**` edit rebuilds
      # the jars without re-running it. Computed before the restores, so the hash covers the
      # checkout and not the restored build output.
      - name: Compute the JVM cache keys
        id: keys
        env:
          SOURCES: ${{ hashFiles('host/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**') }}
          BUILD_CONFIG: ${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**') }}
          SHARED: ${{ steps.shared.outputs.revision }}
        run: |
          echo "jars=ta-jars-v1-${{ runner.os }}-jdk${JAVA_VERSION}-${SHARED}-${SOURCES}" >> "$GITHUB_OUTPUT"
          echo "jvmtest=ta-jvmtest-v1-${{ runner.os }}-${SHARED}-${BUILD_CONFIG}" >> "$GITHUB_OUTPUT"

      # restore/save, not the combined action: that one saves from a post step that runs even on
      # failure, which would cache jars from a red build and mark a failing revision as tested.
      - name: Restore the built JARs
        id: jars-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            host/build/libs
            host/build/reports/ta-jars
          key: ${{ steps.keys.outputs.jars }}

      - name: Restore the :shared:jvmTest result
        id: jvmtest-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache
          key: ${{ steps.keys.outputs.jvmtest }}

      # Only :shared:jvmTest needs a GL stack; building the jars does not.
      - name: Install headless OpenGL/GLES runtime
        if: steps.jvmtest-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri

      - name: Set up JDK
        if: steps.jars-cache.outputs.cache-hit != 'true' || steps.jvmtest-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # cache-encryption-key is what lets gradle/actions persist the CONFIGURATION cache; without
      # it the entry is stored every run and reused never. An unset secret degrades to that.
      - name: Setup Gradle
        if: steps.jars-cache.outputs.cache-hit != 'true' || steps.jvmtest-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Make gradlew executable
        if: steps.jars-cache.outputs.cache-hit != 'true' || steps.jvmtest-cache.outputs.cache-hit != 'true'
        run: chmod +x gradlew

      # verifyTaRenderJarSeal is the ADR 0006/0007 gate: no com/lascade/ta/shared/builder/**
      # class in the jar the public wheel ships, because JVM bytecode decompiles trivially.
      # Not the last word -- verify_tada_wheel.py re-runs it on the jar inside each finished
      # wheel, since an artifact round-trip and a jar rewrite sit between here and there -- which
      # is also what keeps the seal enforced on a cache hit, where this step does not run.
      - name: Build the two JARs and verify the builder seal
        if: steps.jars-cache.outputs.cache-hit != 'true'
        run: ./gradlew :host:taJars

      # The report is written before the task throws, so a RED run is when it is worth having.
      # `warn`, not `error`: an earlier failure legitimately leaves no report to collect.
      - name: Upload ta-render.jar seal report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ta-jars-seal
          path: host/build/reports/ta-jars/seal.txt
          if-no-files-found: warn
          retention-days: 7

      # -PtaSharedRequireGl turns "61 skipped, BUILD SUCCESSFUL" -- what a missing libgles2
      # produces, since these tests skip by design where there is no GLES -- into a failure.
      # No taSharedAngleDir: Linux tests the system-GLES path; ANGLE is the macOS/Windows answer.
      - name: Run the shared renderer JVM tests
        if: steps.jvmtest-cache.outputs.cache-hit != 'true'
        run: ./gradlew :shared:jvmTest -PtaSharedRequireGl=true

      # A jar is a zip: no file modes travel with it, so upload-artifact stripping them is moot.
      - name: Upload ta-render.jar
        uses: actions/upload-artifact@v7
        with:
          name: ta-render-jar
          path: host/build/libs/ta-render.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # A SEPARATE artifact, not a second file in the one above: the four wheel legs download
      # that one and have no use for this jar, and this jar is the one carrying the sealed
      # `builder/` package. Only the bundle job -- the single place the shipped private wheel
      # is built -- pulls it.
      - name: Upload ta-prepare.jar
        uses: actions/upload-artifact@v7
        with:
          name: ta-prepare-jar
          path: host/build/libs/ta-prepare.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Saved last and without always(): a step `if` implies success(), so a red build caches
      # neither its jars nor a passing verdict for its shared revision.
      - name: Cache the built JARs
        if: steps.jars-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            host/build/libs
            host/build/reports/ta-jars
          key: ${{ steps.keys.outputs.jars }}

      - name: Record the passing :shared:jvmTest revision
        if: steps.jvmtest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci-cache
          echo "${{ steps.shared.outputs.revision }}" > .ci-cache/jvmtest-passed

      - name: Save the :shared:jvmTest result
        if: steps.jvmtest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache
          key: ${{ steps.keys.outputs.jvmtest }}

  # The four platform wheels. Defined in `_tada-wheels.yml` because PyPI publishes the same
  # four, and one copy is what keeps the ANGLE digests from drifting between the two paths.
  # It downloads the `ta-render-jar` artifact `jvm-build` uploaded above -- a reusable workflow
  # shares the caller's run, so the jar is still built exactly once.
  wheel:
    name: Wheels
    needs: [validate-python, jvm-build]
    uses: ./.github/workflows/_tada-wheels.yml
    with:
      repo: ${{ github.event.client_payload.repo }}
      sha: ${{ github.event.client_payload.sha }}
    secrets: inherit

  # ---------------------------------------------------------------------------------------
  # The GHCR bundle: five files, ONE platform (backlog C10).
  #
  # TARS declares `"target_platform": "linux/amd64"` and builds only that, so the bundle
  # carries the manylinux x86-64 public wheel and the private wheel, not the whole matrix.
  # PyPI is where the other platforms go. `platform_tag` in build-metadata.json is how a
  # consumer knows which one it got, and schema_version 3 is what makes reading it mandatory.
  # ---------------------------------------------------------------------------------------
  bundle:
    name: Assemble the release bundle
    # jvm-build is already implied through `wheel`; it is named because this job downloads an
    # artifact that job produces (ta-prepare.jar), and a `needs` that only says so by transitive
    # implication is one refactor away from being wrong.
    needs: [validate-python, jvm-build, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      # Only the x86-64 leg's wheel. The others exist as artifacts for the PyPI path and are
      # deliberately not downloaded here -- a bundle that quietly grew a second public wheel
      # would break every one of TARS's shape checks at deploy time rather than here.
      - name: Download the manylinux x86-64 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x64
          path: platform

      # The PRIVATE wheel's payload (ADR 0015): ta-render.jar plus the sealed `builder/`
      # package, which is why it lands here and never in a wheel job.
      - name: Download ta-prepare.jar
        uses: actions/download-artifact@v8
        with:
          name: ta-prepare-jar
          path: jar

      # build_tada_wheel.sh drives two of these itself; it resolves them from its own
      # directory, so all three are fetched into one.
      - name: Fetch the packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tada-wheel"
          base=https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel
          for name in build_tada_wheel.sh build_prepare_payload.py inject_wheel_payload.py; do
            curl -sSfL "$base/$name" -o "$RUNNER_TEMP/tada-wheel/$name"
          done

      - name: Build wheel bundle and runtime pylock
        env:
          SHARED_REVISION: ${{ steps.shared.outputs.revision }}
          TADA_REPOSITORY: ${{ github.event.client_payload.repo }}
          TADA_REVISION: ${{ github.event.client_payload.sha }}
          PREPARE_JAR: jar/ta-prepare.jar
        run: |
          PUBLIC_WHEEL="$(ls platform/travel_animator-*manylinux*x86_64.whl)" \
            bash "$RUNNER_TEMP/tada-wheel/build_tada_wheel.sh"

      - name: Install the GL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri libfontconfig1

      - name: Verify wheel metadata and pylock resolution
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_wheel_install.sh -o "$RUNNER_TEMP/verify_wheel_install.sh"
          bash "$RUNNER_TEMP/verify_wheel_install.sh"

      # Credentials, required modules, AND -- for a platform wheel -- the builder seal
      # re-checked on the shipped jar, the class-file major, the natives layout and the
      # ANGLE rule. Backlog C11. The private wheel gets the same seal in reverse: its
      # ta-prepare.jar must be present, must carry `builder/`, and must be Java 21, because
      # it runs on the public wheel's JRE (ADR 0015).
      - name: Verify wheel contents and JVM payload
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_tada_wheel.py -o "$RUNNER_TEMP/verify_tada_wheel.py"
          uv run --locked python "$RUNNER_TEMP/verify_tada_wheel.py"

      # Still five, and deliberately so (C10): two wheels, pylock.toml, build-metadata.json,
      # SHA256SUMS. build_tada_wheel.sh asserts the same thing at the point it decides the
      # shape; this is the second reader, on the artifact rather than the intent.
      - name: Verify release bundle
        run: |
          shopt -s nullglob
          files=(bundle/*)
          if (( ${#files[@]} != 5 )); then
            printf 'expected five bundle files, found:\n' >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum --check SHA256SUMS
          )
          echo "platform_tag: $(python3 -c 'import json;print(json.load(open("bundle/build-metadata.json"))["platform_tag"])')"

      - name: Upload publish bundle
        uses: actions/upload-artifact@v7
        with:
          name: tada-wheel-bundle
          path: bundle/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish latest wheel bundle
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-tada-wheel-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada, packages)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Download verified bundle
        uses: actions/download-artifact@v8
        with:
          name: tada-wheel-bundle
          path: bundle

      - name: Refuse a stale main publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
          TARGET_REPO: ${{ github.event.client_payload.repo }}
        run: |
          main_sha="$(gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$DISPATCHED_SHA" != "$main_sha" ]]; then
            echo "refusing to replace latest: dispatched=$DISPATCHED_SHA main=$main_sha" >&2
            exit 1
          fi

      - name: Re-verify downloaded bundle
        run: |
          files=(bundle/*)
          if (( ${#files[@]} != 5 )); then
            echo "downloaded release bundle must contain exactly five files" >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum --check SHA256SUMS
          )

      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.2

      - name: Log in to GHCR
        # GHCR write uses the actions repo's own GITHUB_TOKEN (the runner lives in
        # Lascade-Co/actions, so its token can create/push/prune this package). A tada-scoped
        # App-installation token is forbidden from writing org packages (see ADR 0002).
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

      - name: Push release bundle as latest
        id: push
        env:
          TARGET_SHA: ${{ github.event.client_payload.sha }}
          TARGET_REPO: ${{ github.event.client_payload.repo }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/push_ghcr_bundle.sh -o "$RUNNER_TEMP/push_ghcr_bundle.sh"
          digest="$(bash "$RUNNER_TEMP/push_ghcr_bundle.sh")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Delete every previous package version
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ steps.repo.outputs.owner }}
          PACKAGE: tada-wheel
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/prune_ghcr_versions.sh -o "$RUNNER_TEMP/prune_ghcr_versions.sh"
          bash "$RUNNER_TEMP/prune_ghcr_versions.sh"

      - name: Log out of GHCR
        if: always()
        run: oras logout ghcr.io || true
