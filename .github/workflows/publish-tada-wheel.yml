name: Central Publish TADA Wheel
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [publish-tada-wheel]

# A newer dispatch cancels older runs of this group. The publish job additionally
# takes a dedicated non-cancel group to serialize concurrent GHCR mutations, and
# re-checks that the built commit is still main's head before replacing latest.
# (A superseding dispatch can still cancel an in-flight run; the stale-guard is what
# guarantees a superseded commit is never what ends up published.)
concurrency:
  group: publish-tada-wheel-${{ github.event.client_payload.repo }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------------------------
# ANGLE is CONSUMED here, never built here.
# ---------------------------------------------------------------------------------------------
#
# macOS and Windows have no system EGL/GLES, so their wheels must carry ANGLE. It is built ONCE
# per revision, out of band, on a machine that can build it -- an ANGLE build is a ~14 GB Chromium
# checkout and a two-hour compile -- then published as a GitHub release asset and downloaded here
# BY DIGEST. No workflow in this repository builds it, and adding one would be a regression: the
# digest below is what makes the bytes in a published wheel the same bytes that were verified by
# hand, and a per-build compile would replace that guarantee with a hope.
#
# The constants below are the pin. `travel-animator-shared`'s `angleRevision`/`angleSha256` (iOS)
# and the PROVENANCE documents are the other copies; a revision bump moves ALL of them in ONE
# change, or the platforms stop rendering the same pixels (risk R14: two ANGLE revisions means two
# shader translators). The release tag is the revision's first 8 characters by convention, and the
# ANGLE fetch step asserts that rather than trusting it.
env:
  ANGLE_REVISION: be80ce591a481c12d60c50d6040d40c035b40a2b
  ANGLE_RELEASE_REPO: Lascade-Co/travel-animator-shared
  ANGLE_RELEASE_TAG: angle-be80ce59
  # Built from source on an M2, 2026-08-11, and verified to produce a BIT-IDENTICAL 695-frame
  # render to the previous reference. See travel-animator-shared third_party/angle/PROVENANCE-macos.md.
  ANGLE_SHA256_MACOS: dfe3d633b280bf2479189716ad3ab14381260180bd5c5246c3d80913eb477e30
  # Built by hand on a real Windows host 2026-08-11, published, and verified through
  # scripts/angle/fetch_pinned_angle.py against the release. Do NOT ever replace this with Skiko's
  # `skiko-awt-runtime-angle-windows-x64`: that is ANGLE 2.1.25511 against our 2.1.28587, which is
  # precisely the skew this pin exists to prevent. See scripts/angle/PROVENANCE-windows.md. This digest is of the
  # REPACKED asset: the Windows build wrote its zip entries with backslash separators, which the
  # ZIP spec forbids and which extract as flat files named `include\EGL\egl.h` on Linux/macOS.
  # Only the separators changed -- all 24 entries are byte-identical to the original and every
  # digest in the asset's own PROVENANCE.json still verifies.
  ANGLE_SHA256_WINDOWS_X64: 8a2732e41e0e14471fe7f852c6ee13a1ace13ed2178231c8d16353e1b35a59cc

# ---------------------------------------------------------------------------------------------
# Shape (KMP renderer migration, backlog C1/C2/C3/C8/C10)
# ---------------------------------------------------------------------------------------------
#
#   validate-python  ubuntu-24.04   uv sync, protos, pytest                       [unchanged work]
#   jvm-build        ubuntu-24.04   ./gradlew :host:taJars + seal + :shared:jvmTest
#                                   -> uploads ta-render.jar ONCE
#   wheel   (matrix) 4 runners      fetch+verify ANGLE (macOS/Windows), jlink, stage natives,
#                                   inject, retag, verify, GL smoke
#   bundle           ubuntu-24.04   the 5-file GHCR bundle, from the x86-64 leg's wheel
#   publish          ubuntu-24.04   ORAS push + prune                           [barely changed]
#
# The single `validate` job could not survive, for three independent reasons (CI doc §4):
# **jlink cannot cross-target** -- a linux-x64 JDK cannot emit a macOS-arm64 runtime;
# **macOS ad-hoc signing needs `codesign`**, i.e. a real macOS runner; and a platform-tagged
# wheel only installs on a matching runner, so it can only be smoke-tested on one.
#
# `ta-render.jar` is built ONCE and passed as an artifact, because it is architecture-neutral
# (all six LWJGL classifiers, tada commit c8dcfec). That keeps Gradle -- a three-build composite
# over tada + shared -- off the other four runners entirely.
#
# ⚠️ NOTHING IN THIS FILE HAS EVER RUN. It was written against artifacts verified locally
# (a real ta-render.jar, real manylinux containers, a real Debian bookworm install) but no
# GitHub runner has executed it. See the scripts it calls for what WAS executed.
jobs:
  validate-python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Mesa picks a Gallium driver by probing; a GitHub runner has no GPU, so pin the software
      # rasterizer explicitly instead of depending on what the probe happens to land on.
      # llvmpipe backs BOTH client APIs used here -- desktop GL for moderngl and GLES for the
      # JVM renderer -- so this is one knob for both, and it makes the pixels deterministic.
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Two client APIs come out of this one Mesa stack, and the package list is their union:
      #   * moderngl binds EGL_OPENGL_API -- DESKTOP GL, linking libGL.so.1  -> libegl1 + libgl1
      #   * the KMP/JVM renderer binds EGL_OPENGL_ES_API and resolves
      #     libGLESv2.so.2 at runtime via dlopen                             -> libgles2
      #
      # libgles2 is the load-bearing addition: nothing else here pulls it in, and without it the
      # JVM GL suite finds no driver and *skips* rather than fails -- "0 failures, 61 skipped,
      # BUILD SUCCESSFUL", a green run that exercised no GL at all.
      #
      # libegl-mesa0 is Mesa's EGL *vendor* library, which the vendor-neutral libegl1 loader
      # dispatches to. It is only a `Recommends:` of libegl1 and this install passes
      # --no-install-recommends, so it has been surviving purely on the runner image's
      # preinstalled set -- not a contract. Name it.
      #
      # libgl1 / libgl1-mesa-dri stay: moderngl still ships in the wheel, and mesa-dri is the
      # llvmpipe Gallium driver that actually rasterizes for BOTH APIs on a GPU-less runner.
      - name: Install headless OpenGL/GLES runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --all-packages --all-extras is load-bearing: grpcio-tools (protoc codegen) and the
      # mcp SDK are declared on the tada_render member, not the workspace root. A plain
      # `uv sync --locked` installs neither, so codegen and the MCP server tests fail. The
      # flags repeat on every `uv run` below: each step re-syncs, and must not prune them.
      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      # The generator lives in the tada_render workspace member, not the repo root: only that
      # package needs protoc codegen (the config schema and the vector-tile decoder are
      # both its own). It resolves the `shared` submodule relative to the workspace root, so
      # invoking it by path from here is correct.
      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      - name: Run tests from the lockfile
        run: uv run --locked --all-packages --all-extras pytest

  # ---------------------------------------------------------------------------------------
  # The JAR, built exactly once.
  #
  # It is architecture-neutral: `host/build.gradle.kts` declares all six LWJGL native
  # classifiers rather than the build host's (tada c8dcfec), so one jar serves every leg.
  # It is NOT Skiko-neutral -- `shared/build.gradle.kts` resolves
  # `skiko-awt-runtime-$hostOs-$hostArch` from the build machine -- which is why
  # `build_jvm_payload.py` strips `libskiko-*` out of the copy it puts in each wheel and
  # stages the right one beside it. Backlog C4, closed at packaging time rather than in Gradle.
  # ---------------------------------------------------------------------------------------
  jvm-build:
    name: Build ta-render.jar and run the renderer suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # NO rentile checkout. It used to be tada's second submodule, pulled in as a composite
      # `includeBuild`, and two steps here resolved its revision and owner/repo out of
      # `.gitmodules` so the Gradle configure phase could find it. That is gone: rentile
      # publishes to Maven Central and `shared/build.gradle.kts` asks for a version like any
      # other dependency, so the ordinary dependency cache resolves it.
      #
      # Do not reinstate those steps. They ran `git rev-parse HEAD:rentile` under
      # `set -euo pipefail`, so with the submodule removed they do not degrade -- they kill the
      # job before it configures anything.

      - name: Install headless OpenGL/GLES runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1 \
            libgl1-mesa-dri

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # taJars builds ta-render.jar AND ta-prepare.jar, then runs verifyTaRenderJarSeal -- the
      # ADR 0006/0007 gate that ta-render.jar (the one the public wheel ships) carries no
      # com/lascade/ta/shared/builder/** class. JVM bytecode decompiles trivially, so a leak
      # there publishes the choreography code those ADRs exist to withhold. The task checks in
      # both directions: it also fails if the sealed prefix has stopped matching anything.
      #
      # This is NOT the last word on the seal. `verify_tada_wheel.py` re-runs it on the jar
      # inside each finished wheel, because between here and there sit an artifact round-trip
      # and a jar rewrite (see build_jvm_payload.py), and Gradle's check covers none of that.
      - name: Build the two JARs and verify the builder seal
        run: ./gradlew :host:taJars

      # The seal report is written before verifyTaRenderJarSeal throws, so uploading it on a RED
      # run is the point: it names the offending classes. `warn`, not `error`, because an earlier
      # failure (compile, dependency resolution) legitimately leaves no report to collect.
      - name: Upload ta-render.jar seal report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ta-jars-seal
          path: host/build/reports/ta-jars/seal.txt
          if-no-files-found: warn
          retention-days: 7

      # The renderer's own suite, including the GL conformance tests ported from the Android
      # device / iOS simulator suites.
      #
      # -PtaSharedRequireGl=true is not optional here. Those tests SKIP when no GL driver is
      # reachable, by design -- macOS and Windows have no system GLES -- so on Linux there is no
      # flag whose absence signals misconfiguration, and a missing libgles2 would read as a pass.
      # The property makes the driver throw instead of skip.
      #
      # No taSharedAngleDir on Linux, deliberately: the system-GLES path installed above is
      # exactly what is under test here. ANGLE is the macOS/Windows answer.
      - name: Run the shared renderer JVM tests
        run: ./gradlew :shared:jvmTest -PtaSharedRequireGl=true

      # The one artifact every wheel leg needs. A jar is a zip, so no file modes travel with
      # it and `upload-artifact`'s mode-stripping is irrelevant here.
      - name: Upload ta-render.jar
        uses: actions/upload-artifact@v7
        with:
          name: ta-render-jar
          path: host/build/libs/ta-render.jar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------------------
  # One wheel per platform.
  #
  # Every leg does the same five things -- build the pure wheel, assemble the payload, fold it
  # in, verify, smoke -- but on different runners, because jlink runs on the target and a
  # platform wheel installs only where its tag matches.
  #
  # macos-arm64 is HERE now, and what changed is licensing, not engineering. Its payload must
  # carry ANGLE (macOS has no system EGL/GLES), and the ANGLE it used to carry was extracted
  # from a Google Chrome install -- which works, and is not redistributable, so it could never
  # ship in a PyPI wheel. ANGLE is BSD-3-Clause, so building it from source removes that
  # constraint entirely: `angle-be80ce59-macos.zip` is our own build of the pinned revision,
  # verified on an M2 to produce a BIT-IDENTICAL 695-frame render to the Chrome-ANGLE
  # reference. The leg downloads it and checks its SHA-256 (backlog C5, closed).
  #
  # ⚠️ windows-x64 IS HERE AND CURRENTLY FAILS, ON PURPOSE. There is no Windows ANGLE of ours
  # yet -- it needs a Windows host with Visual Studio, which this project has never had -- so
  # `ANGLE_SHA256_WINDOWS_X64` is empty and the fetch step stops the leg with a message naming
  # scripts/angle/PROVENANCE-windows.md and the one-time build it describes. The alternative
  # was worse: Skiko's `skiko-awt-runtime-angle-windows-x64` is public and easy, and it is
  # ANGLE 2.1.25511 against the 2.1.28587 every other platform runs -- a second shader
  # translator quietly rasterising the same frame differently (risk R14). A loud failure is the
  # honest state; a silent skew in a published wheel is not. (R11 is still open besides:
  # libEGL.dll resolves libGLESv2.dll by BARE NAME via LoadLibraryW, so the two must sit in one
  # directory -- which the packaging guarantees, and which no Windows binary in this project
  # has yet executed.)
  #
  # linux-arm64 needs a `ubuntu-24.04-arm` runner. Those are GA for public repos and BILLED
  # for private ones (CI doc §8 lists this as undetermined). If the org has not enabled them
  # the leg fails at scheduling, which is a clear failure rather than a silent gap.
  # ---------------------------------------------------------------------------------------
  wheel:
    name: Wheel (${{ matrix.platform }})
    needs: [validate-python, jvm-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            tag: manylinux_2_28_x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            # NOT 2_28: LWJGL 3.3.6's aarch64 liblwjgl.so references GLIBC_2.34, so the whole
            # wheel is capped there. Measured 2026-08-11; auditwheel refuses 2_28 outright.
            tag: manylinux_2_34_aarch64
          # `angle_platform` is the suffix of the release asset name -- the leg downloads
          # `${ANGLE_RELEASE_TAG}-<angle_platform>.zip` and verifies its digest. Its absence is
          # what marks a leg as needing no ANGLE at all; Linux renders on the system EGL/GLES
          # and a bundled payload there would take the GPU worker off the NVIDIA driver.
          - platform: macos-arm64
            runner: macos-14
            container: ""
            tag: macosx_11_0_arm64
            angle_platform: macos
          - platform: windows-x64
            runner: windows-latest
            container: ""
            tag: win_amd64
            angle_platform: windows-x64
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        shell: bash
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      # The PURE public wheel, which every leg then folds its own payload into. Building it
      # here rather than once centrally keeps `uv build` on the same checkout that generated
      # the protos, and the result is identical across legs by construction.
      - name: Build the pure wheels
        run: uv build --wheel --all-packages --out-dir pure

      - name: Download ta-render.jar
        uses: actions/download-artifact@v8
        with:
          name: ta-render-jar
          path: jar

      - name: Fetch the packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-scripts
          base=https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel
          for name in build_jvm_payload.py inject_wheel_payload.py check_glibc_floor.py \
                      assert_wheel_exec_bit.py build_linux_wheel.sh; do
            curl -sSfL "$base/$name" -o "ci-scripts/$name"
          done

      # ---------------------------------------------------------------------------------
      # Linux: everything glibc-sensitive happens INSIDE manylinux_2_28.
      #
      # `docker run` rather than a job-level `container:` on purpose. The container is needed
      # for exactly one thing -- assembling and measuring the payload against glibc 2.28 --
      # and putting the whole job in it would drag checkout, setup-uv, setup-java and every
      # upload through an AlmaLinux 8 image for no benefit. It also means what runs in CI is
      # byte-for-byte the command that was run locally to verify this, which is the only
      # reason any of it is trusted.
      # ---------------------------------------------------------------------------------
      - name: Build the platform wheel (Linux, in manylinux)
        if: ${{ matrix.container != '' }}
        env:
          CONTAINER: ${{ matrix.container }}
          IO_PLATFORM: ${{ matrix.platform }}
          MANYLINUX_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/io" -w /io \
            -e IO_WHEEL="/io/$(ls pure/travel_animator-*.whl)" \
            -e IO_JAR=/io/jar/ta-render.jar \
            -e IO_OUT=/io/platform \
            -e IO_PLATFORM="$IO_PLATFORM" \
            -e MANYLINUX_TAG="$MANYLINUX_TAG" \
            "$CONTAINER" bash /io/ci-scripts/build_linux_wheel.sh

      # ---------------------------------------------------------------------------------
      # macOS and Windows: no container, and ANGLE is DOWNLOADED -- never built here.
      # ---------------------------------------------------------------------------------
      - name: Set up JDK for jlink
        if: ${{ matrix.container == '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # One pinned revision, one release, one asset per platform, each pinned by SHA-256 --
      # the same arrangement shared's `downloadAngle` task uses for iOS, for the same reason:
      # the digest is what makes the binaries in a published wheel the binaries that were
      # verified by hand. A mismatch FAILS the job; it is never a warning.
      #
      # `travel-animator-shared` is private, so this needs the App token minted above and the
      # REST asset endpoint with `Accept: application/octet-stream` (the browser-facing
      # releases/download URL 404s unauthenticated). fetch_pinned_angle.py does both.
      - name: Fetch and verify the pinned ANGLE
        if: ${{ matrix.angle_platform != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANGLE_PLATFORM: ${{ matrix.angle_platform }}
        run: |
          set -euo pipefail

          # The tag is the revision's first 8 characters. Asserted, not assumed: a half-edited
          # pin would otherwise download a DIFFERENT revision that still passes its checksum.
          if [[ "$ANGLE_RELEASE_TAG" != "angle-${ANGLE_REVISION:0:8}" ]]; then
            echo "::error::ANGLE_RELEASE_TAG '$ANGLE_RELEASE_TAG' does not match ANGLE_REVISION" \
                 "'$ANGLE_REVISION' (expected angle-${ANGLE_REVISION:0:8}). The pin is half-edited."
            exit 1
          fi

          case "$ANGLE_PLATFORM" in
            macos)       sha256="$ANGLE_SHA256_MACOS" ;;
            windows-x64) sha256="$ANGLE_SHA256_WINDOWS_X64" ;;
            *) echo "::error::no pinned ANGLE checksum is wired for '$ANGLE_PLATFORM'"; exit 1 ;;
          esac

          # The Windows gap, stated rather than papered over.
          if [[ -z "$sha256" ]]; then
            echo "::error::ANGLE for $ANGLE_PLATFORM has not been built and published yet - see scripts/angle/PROVENANCE-windows.md"
            cat >&2 <<EOF

          ================================================================================
          No ANGLE asset is published for $ANGLE_PLATFORM at revision $ANGLE_REVISION.

          CI does not build ANGLE. It consumes a prebuilt, pinned, checksummed release asset,
          and there is no such asset for this platform, so this wheel cannot be built.

          To unblock, ONCE:
            1. On a Windows box with Visual Studio 2022 + the Windows SDK, run
               scripts/angle/build_angle_windows.ps1 -Revision $ANGLE_REVISION -TargetCpu x64
               following scripts/angle/PROVENANCE-windows.md.
            2. Verify it (that document's checklist), then
               gh release upload $ANGLE_RELEASE_TAG ${ANGLE_RELEASE_TAG}-${ANGLE_PLATFORM}.zip \\
                 --repo $ANGLE_RELEASE_REPO
            3. Set ANGLE_SHA256_WINDOWS_X64 in this workflow to the published digest.

          Do NOT substitute Skiko's skiko-awt-runtime-angle-windows-x64. It is ANGLE 2.1.25511
          against the 2.1.28587 every other platform of this project renders through: a second
          shader translator, a second rasterisation of the same frame (risk R14). Failing here
          is the intended behaviour until the asset above exists.
          ================================================================================
          EOF
            exit 1
          fi

          mkdir -p ci-scripts
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/angle/fetch_pinned_angle.py \
            -o ci-scripts/fetch_pinned_angle.py
          python ci-scripts/fetch_pinned_angle.py \
            --repo "$ANGLE_RELEASE_REPO" \
            --tag "$ANGLE_RELEASE_TAG" \
            --asset "${ANGLE_RELEASE_TAG}-${ANGLE_PLATFORM}.zip" \
            --sha256 "$sha256" \
            --out angle

      - name: Build the platform wheel (native runner)
        if: ${{ matrix.container == '' }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          skiko_version=0.148.2
          # Skiko names its runtime artifacts with the same os-arch spelling we use.
          curl -sSfL --retry 5 --retry-delay 3 -o skiko.jar \
            "https://repo1.maven.org/maven2/org/jetbrains/skiko/skiko-awt-runtime-${PLATFORM}/${skiko_version}/skiko-awt-runtime-${PLATFORM}-${skiko_version}.jar"
          python ci-scripts/build_jvm_payload.py \
            --platform "$PLATFORM" \
            --jar jar/ta-render.jar \
            --skiko-jar skiko.jar \
            --angle-dir angle \
            --platform-tag "$TAG" \
            --out payload
          python ci-scripts/inject_wheel_payload.py \
            --wheel "$(ls pure/travel_animator-*.whl)" \
            --payload payload \
            --tag "py3-none-${TAG}" \
            --out-dir platform
          python ci-scripts/assert_wheel_exec_bit.py "$(ls platform/*.whl)"
          cp payload/PAYLOAD.json "platform/PAYLOAD-${PLATFORM}.json"

      # ---------------------------------------------------------------------------------
      # The smoke: install the finished wheel and make it render a GL probe through its OWN
      # payload. This is the step that would have caught the pip/uv execute-bit divergence
      # (pip additionally requires the regular-file type bits in the zip's external_attr;
      # uv does not), and it is the only check that exercises the launcher, the JRE, the
      # LWJGL shims, Skiko and the GL driver together.
      #
      # On Linux it runs on the HOST runner, not in manylinux: the host is where a real GL
      # stack can be apt-installed, and a manylinux_2_28 wheel installs happily on glibc 2.39.
      # ---------------------------------------------------------------------------------
      - name: Install the GL runtime for the smoke (Linux)
        if: ${{ matrix.container != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri libfontconfig1

      - name: Smoke the packaged renderer
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke --no-deps "$(ls platform/*.whl)" numpy
          uv run --python .smoke --no-project python - <<'PY'
          import subprocess, sys
          from tada_render import render_bridge

          command = render_bridge.packaged_runtime()
          if command is None:
              sys.exit("the installed wheel carries no JVM payload")
          print("launcher:", " ".join(command))
          env = render_bridge.child_environment()
          print("TADA_ANGLE_DIR:", env.get(render_bridge.ANGLE_DIR_ENV, "(none: system GLES)"))
          # exit 70 is the protocol's `gl_unavailable`; anything else is a launcher or
          # packaging failure and must not be reported as a driver problem.
          result = subprocess.run(command + ["self-test"], env=env,
                                  capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          if result.returncode == 137 or result.returncode == -9:
              sys.exit("SIGKILL with no stderr -- on macOS this is a TAMPERED CODE SIGNATURE, "
                       "not a GL failure. Re-sign after any lipo/strip/install_name_tool.")
          if result.returncode != 0:
              sys.exit(f"self-test exited {result.returncode}")
          PY

      - name: Upload the platform wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: platform/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------------------
  # The GHCR bundle: five files, ONE platform (backlog C10).
  #
  # TARS declares `"target_platform": "linux/amd64"` and builds only that, so the bundle
  # carries the manylinux x86-64 public wheel and the private wheel, not the whole matrix.
  # PyPI is where the other platforms go. `platform_tag` in build-metadata.json is how a
  # consumer knows which one it got, and schema_version 3 is what makes reading it mandatory.
  # ---------------------------------------------------------------------------------------
  bundle:
    name: Assemble the release bundle
    needs: [validate-python, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ dispatched commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      # Only the x86-64 leg's wheel. The others exist as artifacts for the PyPI path and are
      # deliberately not downloaded here -- a bundle that quietly grew a second public wheel
      # would break every one of TARS's shape checks at deploy time rather than here.
      - name: Download the manylinux x86-64 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x64
          path: platform

      - name: Build wheel bundle and runtime pylock
        env:
          SHARED_REVISION: ${{ steps.shared.outputs.revision }}
          TADA_REPOSITORY: ${{ github.event.client_payload.repo }}
          TADA_REVISION: ${{ github.event.client_payload.sha }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/build_tada_wheel.sh -o "$RUNNER_TEMP/build_tada_wheel.sh"
          PUBLIC_WHEEL="$(ls platform/travel_animator-*manylinux*x86_64.whl)" \
            bash "$RUNNER_TEMP/build_tada_wheel.sh"

      - name: Install the GL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri libfontconfig1

      - name: Verify wheel metadata and pylock resolution
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_wheel_install.sh -o "$RUNNER_TEMP/verify_wheel_install.sh"
          bash "$RUNNER_TEMP/verify_wheel_install.sh"

      # Credentials, required modules, AND -- for a platform wheel -- the builder seal
      # re-checked on the shipped jar, the class-file major, the natives layout and the
      # ANGLE rule. Backlog C11.
      - name: Verify wheel contents and JVM payload
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/verify_tada_wheel.py -o "$RUNNER_TEMP/verify_tada_wheel.py"
          uv run --locked python "$RUNNER_TEMP/verify_tada_wheel.py"

      # Still five, and deliberately so (C10): two wheels, pylock.toml, build-metadata.json,
      # SHA256SUMS. build_tada_wheel.sh asserts the same thing at the point it decides the
      # shape; this is the second reader, on the artifact rather than the intent.
      - name: Verify release bundle
        run: |
          shopt -s nullglob
          files=(bundle/*)
          if (( ${#files[@]} != 5 )); then
            printf 'expected five bundle files, found:\n' >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum --check SHA256SUMS
          )
          echo "platform_tag: $(python3 -c 'import json;print(json.load(open("bundle/build-metadata.json"))["platform_tag"])')"

      - name: Upload publish bundle
        uses: actions/upload-artifact@v7
        with:
          name: tada-wheel-bundle
          path: bundle/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish latest wheel bundle
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-tada-wheel-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada, packages)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Download verified bundle
        uses: actions/download-artifact@v8
        with:
          name: tada-wheel-bundle
          path: bundle

      - name: Refuse a stale main publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCHED_SHA: ${{ github.event.client_payload.sha }}
          TARGET_REPO: ${{ github.event.client_payload.repo }}
        run: |
          main_sha="$(gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$DISPATCHED_SHA" != "$main_sha" ]]; then
            echo "refusing to replace latest: dispatched=$DISPATCHED_SHA main=$main_sha" >&2
            exit 1
          fi

      - name: Re-verify downloaded bundle
        run: |
          files=(bundle/*)
          if (( ${#files[@]} != 5 )); then
            echo "downloaded release bundle must contain exactly five files" >&2
            exit 1
          fi
          (
            cd bundle
            sha256sum --check SHA256SUMS
          )

      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.2

      - name: Log in to GHCR
        # GHCR write uses the actions repo's own GITHUB_TOKEN (the runner lives in
        # Lascade-Co/actions, so its token can create/push/prune this package). A tada-scoped
        # App-installation token is forbidden from writing org packages (see ADR 0002).
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin

      - name: Push release bundle as latest
        id: push
        env:
          TARGET_SHA: ${{ github.event.client_payload.sha }}
          TARGET_REPO: ${{ github.event.client_payload.repo }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/push_ghcr_bundle.sh -o "$RUNNER_TEMP/push_ghcr_bundle.sh"
          digest="$(bash "$RUNNER_TEMP/push_ghcr_bundle.sh")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Delete every previous package version
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ steps.repo.outputs.owner }}
          PACKAGE: tada-wheel
        run: |
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel/prune_ghcr_versions.sh -o "$RUNNER_TEMP/prune_ghcr_versions.sh"
          bash "$RUNNER_TEMP/prune_ghcr_versions.sh"

      - name: Log out of GHCR
        if: always()
        run: oras logout ghcr.io || true
