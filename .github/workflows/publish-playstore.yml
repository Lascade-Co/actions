name: Publish Play Store
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [publish-playstore, publish-kmp]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: playstore-${{ github.event.client_payload.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TRACK: production
      TARGET_COUNTRY: BD
      TARGET_FRACTION: "0.99"

    steps:
      - name: Checkout central repo (for scripts)
        uses: actions/checkout@v6.1.0

      - name: Validate payload and parse source repository
        id: repo
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          payload = json.loads(os.environ['PAYLOAD'])
          repo = payload.get('repo', '')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo) or repo.split('/')[0].lower() != os.environ['GITHUB_REPOSITORY'].split('/')[0].lower():
              raise ValueError('Source repository must belong to the central organization')
          for key in ('release_id', 'package_name', 'app_name', 'play_console_production_url'):
              if not payload.get(key):
                  raise ValueError('Missing publish payload field: ' + key)
          if not str(payload['release_id']).isdigit():
              raise ValueError('Invalid release ID')
          if os.environ['EVENT_TYPE'] == 'publish-kmp' and payload['package_name'] != 'com.travelanimator.routemap':
              raise ValueError('KMP package must be com.travelanimator.routemap')
          if os.environ['EVENT_TYPE'] == 'publish-kmp' and repo != 'Lascade-Co/travel-animator-shared':
              raise ValueError('Only the approved KMP source repository may publish')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'owner={repo.split("/")[0]}\nname={repo.split("/")[1]}\n')
          PYTHON

      - name: Mint GitHub App token (target repo)
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Fetch GitHub Release + write Play whatsnew (single locale)
        id: meta
        uses: actions/github-script@v8.0.0
        env:
          SOURCE_REPO: ${{ github.event.client_payload.repo }}
          RELEASE_ID: ${{ github.event.client_payload.release_id }}
          RELEASE_LOCALE: ${{ github.event.client_payload.release_notes_locale || 'en-US' }}
          EVENT_TYPE: ${{ github.event.action }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const [owner, repo] = process.env.SOURCE_REPO.split('/');
            const releaseId = Number(process.env.RELEASE_ID);
            const locale = process.env.RELEASE_LOCALE.trim();
            if (!/^[a-z]{2,3}(?:-[A-Za-z0-9]+)*$/.test(locale)) throw new Error('Invalid release locale');

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let rel;

            for (let i = 0; i < 5; i++) {
              rel = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
              const assets = rel.data.assets || [];
              const hasAab = assets.some(a => a.name.toLowerCase().endsWith('.aab'));
              const hasSym = assets.some(a => /native-debug-symbols.*\.zip$/i.test(a.name));
              if (hasAab && hasSym) break;
              await sleep(2000);
            }

            const tag = rel.data.tag_name || '';
            const ghUrl = rel.data.html_url;
            const rawNotes = (rel.data.body || '').trim();

            if (process.env.EVENT_TYPE === 'publish-kmp' && (rel.data.draft || rel.data.prerelease)) {
              throw new Error('KMP publishing requires a published production release');
            }
            if (process.env.EVENT_TYPE === 'publish-kmp' && !rawNotes) {
              throw new Error('KMP release notes must be nonempty and shared by both stores');
            }
            const playNotes = rawNotes || `See GitHub release: ${ghUrl}`;
            // JS length counts UTF-16 units, matching the source notes checker. Never truncate.
            if (playNotes.length > 500) throw new Error('Release notes exceed 500 characters; shorten the release body');

            const whatsNewDir = path.join(process.env.GITHUB_WORKSPACE, 'whatsnew');
            fs.mkdirSync(whatsNewDir, { recursive: true });
            fs.writeFileSync(path.join(whatsNewDir, `whatsnew-${locale}`), playNotes, 'utf8');

            // Retain the original notes for the publisher's release summary.
            fs.writeFileSync('release_notes_raw.txt', rawNotes, 'utf8');

            core.setOutput('tag', tag);
            core.setOutput('gh_url', ghUrl);
            core.setOutput('locale', locale);

      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.event.client_payload.repo }}
          releaseId: ${{ github.event.client_payload.release_id }}
          fileName: "*"
          out-file-path: release-assets
          token: ${{ steps.app-token.outputs.token }}

      - name: Locate AAB + native debug symbols
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          files = list(Path('release-assets').iterdir())
          selected = {'aab': [p for p in files if p.name.lower().endswith('.aab')],
                      'symbols': [p for p in files if 'native-debug-symbols' in p.name.lower() and p.name.lower().endswith('.zip')]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key, paths in selected.items():
                  if len(paths) != 1 or any(c in str(paths[0]) for c in '\r\n'):
                      raise ValueError('Expected exactly one release artifact: ' + key)
                  out.write(f'{key}={paths[0]}\n')
          PY

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Publish rollout + write Telegram message (python)
        env:
          SA_B64: ${{ secrets.SUBSCRIPTION_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          PACKAGE_NAME: ${{ github.event.client_payload.package_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_LOCALE: ${{ steps.meta.outputs.locale }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          RELEASE_URL: ${{ steps.meta.outputs.gh_url }}
          PLAY_URL: ${{ github.event.client_payload.play_console_production_url }}
          AAB_PATH: ${{ steps.assets.outputs.aab }}
          SYMBOLS_PATH: ${{ steps.assets.outputs.symbols }}
        run: |
          set -euo pipefail
          trap 'rm -f play-sa.json' EXIT
          echo "$SA_B64" | base64 --decode > play-sa.json

          python3 scripts/android/publish_playstore.py \
            --service-account-json play-sa.json \
            --package-name "$PACKAGE_NAME" \
            --track "${{ env.TRACK }}" \
            --aab "$AAB_PATH" \
            --native-symbols "$SYMBOLS_PATH" \
            --release-name "$RELEASE_TAG" \
            --notes-file "whatsnew/whatsnew-$RELEASE_LOCALE" \
            --raw-notes-file "release_notes_raw.txt" \
            --app-name "$APP_NAME" \
            --github-release-url "$RELEASE_URL" \
            --play-console-production-url "$PLAY_URL" \
            --country "${{ env.TARGET_COUNTRY }}" \
            --user-fraction "${{ env.TARGET_FRACTION }}" \
            --telegram-out "github_release_body.txt"

      - name: Create PostHog annotation
        if: github.event.client_payload.posthog_project_id != ''
        shell: bash
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT: ${{ github.event.client_payload.posthog_project_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$POSTHOG_PROJECT" =~ ^[0-9]+$ ]]
          curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $POSTHOG_API_KEY" \
            "https://us.posthog.com/api/projects/$POSTHOG_PROJECT/annotations/" \
            -d "$(jq -n \
              --arg content "Android $RELEASE_TAG released" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%S%z)" \
              '{content: $content, date_marker: $date, scope: "project"}')"

      - name: Notify Telegram
        if: ${{ !cancelled() }}
        uses: ./actions/telegram-notify
        with:
          token: ${{ secrets.SUBSCRIPTION_TELEGRAM_TOKEN }}
          chat-id: ${{ secrets.SUBSCRIPTION_TELEGRAM_TO }}
          kind: playstore
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          repo: ${{ github.event.client_payload.repo }}
          title: ${{ github.event.client_payload.app_name }} · ${{ steps.meta.outputs.tag }}
          link: ${{ steps.meta.outputs.gh_url }}
          run-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ github.token }}
