# Native iOS TestFlight, restructured like kmp-build-debug.yml.
# Same file name and event (debug-ios) on purpose: ADR 0008 ties build numbers to this file's run_number,
# and existing triggers (triggers/ios-pr-testflight.yml, D1 apps' testflight.yml) keep working.
#
# Payload: repo, branch | pr, title, project_slug (required), spm_repos (optional),
#   fetch_secrets "true"  -> run the app's scripts/fetch-secrets.sh (needs INFISICAL_PROJECT_ID in /Build)
#   version "auto" | "X.Y.Z" -> auto = scripts/ios/next_version.py
#   debug_flag "false"    -> archive without DEBUG (default on, ADR 0009)
#   patch_rollover "false" -> plain +1 patch (2.4.9 -> 2.4.10); default rolls a 9 into the next minor
#                            (2.4.9 -> 2.5.0). The major never changes automatically (apps force-update on it).
#   force_update "true"   -> next major X.0.0 above the highest App Store version (2.0.2 -> 3.0.0).
#                            Rebuilds reuse X.0.0 until it is on the App Store. Needs version "auto".
# Apple key: Infisical /Build APPSTORE_API_* when all three exist, otherwise the org secrets.
name: Central Native iOS TestFlight
run-name: "${{ format('{0} · {1}', github.event.client_payload.repo, github.event.client_payload.branch || format('PR #{0}', github.event.client_payload.pr)) }}"
on:
  repository_dispatch:
    types: [debug-ios]
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ format('debug-ios-{0}-{1}', github.event.client_payload.repo, github.event.client_payload.pr || github.event.client_payload.branch) }}
  cancel-in-progress: true
defaults:
  run:
    shell: "seal-bash {0}"

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    outputs:
      repo: ${{ steps.source.outputs.repo }}
      owner: ${{ steps.source.outputs.owner }}
      name: ${{ steps.source.outputs.name }}
      pr: ${{ steps.source.outputs.pr }}
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
      title: ${{ steps.source.outputs.title }}
      pr_url: ${{ steps.source.outputs.pr_url }}
      project_slug: ${{ steps.source.outputs.project_slug }}
      token_repos: ${{ steps.scope.outputs.list }}
      project: ${{ steps.meta.outputs.project }}
      scheme: ${{ steps.meta.outputs.scheme }}
      project_version: ${{ steps.meta.outputs.project_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      xcode_version: ${{ steps.meta.outputs.xcode_version }}
      fetch_secrets: ${{ steps.meta.outputs.fetch_secrets }}
      manual_version: ${{ steps.meta.outputs.manual_version }}
      debug_flag: ${{ steps.meta.outputs.debug_flag }}
      force_update: ${{ steps.meta.outputs.force_update }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Fetch trusted helpers
        run: |-
          for f in kmp/control.py ios/native_testflight.py; do
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "$BASE/$f" -o "$RUNNER_TEMP/$(basename "$f").tmp"
            test -s "$RUNNER_TEMP/$(basename "$f").tmp" && mv "$RUNNER_TEMP/$(basename "$f").tmp" "$RUNNER_TEMP/$(basename "$f")"
          done
        env:
          BASE: ${{ format('https://raw.githubusercontent.com/{0}/{1}/scripts', github.repository, github.sha) }}
      - name: Validate dispatch scope before minting credentials
        id: payload
        run: python3 "$RUNNER_TEMP/control.py" validate
      # Private SPM packages from the same org need the App token to reach them (see ios-pr-testflight.yml).
      - name: Compute token repositories
        id: scope
        env:
          NAME: ${{ steps.payload.outputs.name }}
          EXTRA: ${{ github.event.client_payload.spm_repos }}
        run: |-
          if [ -n "$EXTRA" ] && [ "$EXTRA" != null ]; then echo "list=$NAME,$EXTRA" >> "$GITHUB_OUTPUT"
          else echo "list=$NAME" >> "$GITHUB_OUTPUT"; fi
      - name: Mint source-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.payload.outputs.owner }}
          repositories: ${{ steps.scope.outputs.list }}
      - name: Reject fork PRs and pin source HEAD
        id: source
        run: python3 "$RUNNER_TEMP/control.py" resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Read Xcode project, version and build number
        id: meta
        working-directory: source
        run: python3 "$RUNNER_TEMP/native_testflight.py" metadata
        env:
          RUN_NUMBER: ${{ github.run_number }}
          PR: ${{ steps.source.outputs.pr }}
          FETCH_SECRETS: ${{ github.event.client_payload.fetch_secrets }}
          VERSION_INPUT: ${{ github.event.client_payload.version }}
          DEBUG_FLAG: ${{ github.event.client_payload.debug_flag }}
          FORCE_UPDATE: ${{ github.event.client_payload.force_update }}
      - name: Checkout trusted central controls
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Update TestFlight PR status
        uses: ./control/actions/pr-status-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          repository: ${{ steps.source.outputs.repo }}
          pr: ${{ steps.source.outputs.pr }}
          marker: <!-- central-ios-testflight -->
          mode: replace
          body: |-
            TestFlight build ${{ steps.meta.outputs.build_number }} started.
            [Workflow run](${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }})

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  ios-build:
    runs-on: macos-26
    environment: production
    # A cold SwiftPM resolve can be large; the GHCR bundle makes warm runs fast.
    timeout-minutes: 120
    needs: prepare
    defaults:
      run:
        shell: "seal-bash {0}"
        working-directory: source
    outputs:
      version: ${{ steps.marketing.outputs.version }}
      version_verified: ${{ steps.marketing.outputs.verified }}
    steps:
      - name: Seal job output
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Checkout trusted central controls
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Mint source-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.token_repos }}
      - name: Checkout pinned source commit
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      # Only this org's URLs go through the App token; third-party packages fetch anonymously.
      - name: Configure git for private SPM dependencies
        env:
          OWNER: ${{ needs.prepare.outputs.owner }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/${OWNER}/".insteadOf "https://github.com/${OWNER}/"
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ needs.prepare.outputs.xcode_version }}
      - name: Read /Build from Infisical staging
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ needs.prepare.outputs.project_slug }}
          env-slug: staging
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env
      - name: Fetch trusted helpers
        working-directory: .
        run: |-
          for f in ios/native_testflight.py ios/fix_ios_signing.py ios/next_version.py ios/normalize_framework_metadata.py; do
            # next_version.py: PATCH_ROLLOVER and FORCE_UPDATE are opt-in; this workflow sets them below.
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "$BASE/$f" -o "$RUNNER_TEMP/$(basename "$f").tmp"
            test -s "$RUNNER_TEMP/$(basename "$f").tmp" && mv "$RUNNER_TEMP/$(basename "$f").tmp" "$RUNNER_TEMP/$(basename "$f")"
          done
        env:
          BASE: ${{ format('https://raw.githubusercontent.com/{0}/{1}/scripts', github.repository, github.sha) }}
      # Apps that keep config out of git (D1 series) generate it from their own Infisical project.
      - name: Generate app config (scripts/fetch-secrets.sh)
        if: ${{ needs.prepare.outputs.fetch_secrets == 'true' }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: |-
          test -f scripts/fetch-secrets.sh || { echo '::error::fetch_secrets=true but scripts/fetch-secrets.sh is missing'; exit 1; }
          : "${INFISICAL_PROJECT_ID:?add INFISICAL_PROJECT_ID to the app Infisical staging /Build}"
          brew install --quiet infisical/get-cli/infisical
          export INFISICAL_API_URL="${INFISICAL_DOMAIN%/}/api"
          INFISICAL_TOKEN="$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" --domain="$INFISICAL_API_URL" --plain --silent)"
          echo "::add-mask::$INFISICAL_TOKEN"
          INFISICAL_TOKEN="$INFISICAL_TOKEN" bash scripts/fetch-secrets.sh
      # Legacy path (Travel Animator style): one committed-path GoogleService-Info.plist from /Build.
      - name: Decode GoogleService-Info.plist
        if: ${{ needs.prepare.outputs.fetch_secrets != 'true' && env.SERVICE_PLIST_BASE64 != '' }}
        env:
          SCHEME: ${{ needs.prepare.outputs.scheme }}
        run: |-
          plist=$(find . -path '*/GoogleService-Info.plist' -not -path '*/Pods/*' -not -path '*/.build/*' | head -1)
          printf '%s' "$SERVICE_PLIST_BASE64" | base64 --decode > "${plist:-$SCHEME/GoogleService-Info.plist}"
      - name: Choose App Store Connect key
        id: asc
        run: |-
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_ISSUER_ID:-}" ] && [ -n "${APPSTORE_API_PRIVATE_KEY:-}" ]; then
            echo "source=infisical" >> "$GITHUB_OUTPUT"; echo 'Using the App Store Connect key from Infisical /Build'
          else
            echo "source=org" >> "$GITHUB_OUTPUT"; echo 'Using the org App Store Connect key'
          fi
      - name: List provisioning profiles
        id: profiles
        run: python3 "$RUNNER_TEMP/native_testflight.py" profiles
      - name: Install temporary Apple distribution signing
        uses: ./control/actions/apple-signing
        with:
          profiles: ${{ steps.profiles.outputs.list }}
      - name: Read profiles and write ExportOptions.plist
        id: ids
        run: python3 "$RUNNER_TEMP/native_testflight.py" signing
      - name: Switch Xcode project to manual signing
        run: python3 "$RUNNER_TEMP/fix_ios_signing.py"
        env:
          PBXPROJ_PATH: ${{ format('{0}/project.pbxproj', needs.prepare.outputs.project) }}
          IOS_TEAM_ID: ${{ steps.ids.outputs.team }}
      # Hash once before resolve (which can rewrite Package.resolved) so restore and publish agree.
      - name: Compute SwiftPM cache key
        id: spm-key
        working-directory: .
        run: echo "key=spm-$(xcodebuild -version | shasum -a 256 | cut -c1-12)-${{ hashFiles('source/**/Package.resolved') }}" >> "$GITHUB_OUTPUT"
      - name: Restore swiftpm OCI bundle
        id: spm-cache
        uses: ./control/actions/gh-bundle-cache
        with:
          mode: restore
          name: ${{ format('{0}-{1}-{2}-swiftpm-native', needs.prepare.outputs.name, runner.os, runner.arch) }}
          key: ${{ steps.spm-key.outputs.key }}
          fallback-key: latest
          paths: |-
            ~/Library/Caches/org.swift.swiftpm
            source/build/SourcePackages
          token: ${{ github.token }}
      - name: Resolve Swift packages
        id: spm
        run: |-
          xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          SCHEME: ${{ needs.prepare.outputs.scheme }}
      - name: Publish swiftpm OCI bundle
        if: ${{ steps.spm.outcome == 'success' && steps.spm-cache.outputs.hit != 'true' }}
        continue-on-error: true
        uses: ./control/actions/gh-bundle-cache
        with:
          mode: publish
          name: ${{ format('{0}-{1}-{2}-swiftpm-native', needs.prepare.outputs.name, runner.os, runner.arch) }}
          key: ${{ steps.spm-key.outputs.key }}
          fallback-key: latest
          paths: |-
            ~/Library/Caches/org.swift.swiftpm
            source/build/SourcePackages
          token: ${{ github.token }}
      - name: Determine TestFlight marketing version
        id: marketing
        env:
          MANUAL: ${{ needs.prepare.outputs.manual_version }}
          CURRENT_VERSION: ${{ needs.prepare.outputs.project_version }}
          PATCH_ROLLOVER: ${{ github.event.client_payload.patch_rollover != 'false' && 'true' || 'false' }}
          FORCE_UPDATE: ${{ needs.prepare.outputs.force_update }}
          IOS_BUNDLE_ID: ${{ steps.ids.outputs.bundle }}
          APPSTORE_API_KEY_ID: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_API_PRIVATE_KEY || secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |-
          if [ -n "$MANUAL" ]; then
            echo "Manual version $MANUAL from the dispatch"
            printf 'version=%s\nverified=false\n' "$MANUAL" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Project says $CURRENT_VERSION"
            python3 "$RUNNER_TEMP/next_version.py" | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Archive
        id: archive
        env:
          PROJECT: ${{ needs.prepare.outputs.project }}
          SCHEME: ${{ needs.prepare.outputs.scheme }}
          BUILD: ${{ needs.prepare.outputs.build_number }}
          VERSION: ${{ steps.marketing.outputs.version }}
          DEBUG_FLAG: ${{ needs.prepare.outputs.debug_flag }}
        run: |-
          extra=()
          if [ "$DEBUG_FLAG" = true ]; then
            extra=("SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \$(inherited)" "GCC_PREPROCESSOR_DEFINITIONS=DEBUG=1 \$(inherited)")
          fi
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination generic/platform=iOS -archivePath build/App.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages -skipPackageUpdates \
            CURRENT_PROJECT_VERSION="$BUILD" MARKETING_VERSION="$VERSION" CODE_SIGN_STYLE=Manual "${extra[@]}"
      - name: Validate embedded framework metadata
        run: python3 "$RUNNER_TEMP/normalize_framework_metadata.py" --check build/App.xcarchive
      - name: Export IPA
        id: export
        run: xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa -exportOptionsPlist ExportOptions.plist
      # Best effort: the archived app's own plist is the one that ships (works for fetch-secrets apps too).
      - name: Upload dSYMs to Crashlytics
        continue-on-error: true
        run: |-
          tool=build/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
          plist=$(find build/App.xcarchive/Products/Applications -maxdepth 2 -name GoogleService-Info.plist | head -1)
          if [ ! -x "$tool" ] || [ -z "$plist" ]; then echo 'No Crashlytics SDK or plist; skipping'; exit 0; fi
          "$tool" -gsp "$plist" -p ios build/App.xcarchive/dSYMs
      - name: Seal IPA for publishing
        id: pack_1
        run: |
          seal-pack ios-testflight-ipa 'build/ipa/*.ipa'

      - name: Retain IPA for publishing
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight-ipa
          path: ${{ runner.temp }}/seal/art/ios-testflight-ipa/
          retention-days: 3
          overwrite: true

      - name: Remove temporary provisioning profiles
        if: ${{ always() }}
        uses: ./control/actions/apple-signing
        with:
          mode: cleanup

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  ios-publish:
    runs-on: macos-26
    environment: production
    timeout-minutes: 25
    needs: [prepare, ios-build]
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Read /Build from Infisical staging
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ needs.prepare.outputs.project_slug }}
          env-slug: staging
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env
      - name: Fetch trusted helpers
        run: |-
          for f in kmp/control.py; do
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
              "$BASE/$f" -o "$RUNNER_TEMP/$(basename "$f").tmp"
            test -s "$RUNNER_TEMP/$(basename "$f").tmp" && mv "$RUNNER_TEMP/$(basename "$f").tmp" "$RUNNER_TEMP/$(basename "$f")"
          done
        env:
          BASE: ${{ format('https://raw.githubusercontent.com/{0}/{1}/scripts', github.repository, github.sha) }}
      - name: Choose App Store Connect key
        id: asc
        run: |-
          if [ -n "${APPSTORE_API_KEY_ID:-}" ] && [ -n "${APPSTORE_ISSUER_ID:-}" ] && [ -n "${APPSTORE_API_PRIVATE_KEY:-}" ]; then
            echo "source=infisical" >> "$GITHUB_OUTPUT"
          else
            echo "source=org" >> "$GITHUB_OUTPUT"
          fi
      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: ios-testflight-ipa
          path: artifacts/ios

      - name: Unseal IPA
        run: seal-unpack artifacts/ios
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}

      - name: Upload package to TestFlight
        run: |-
          shopt -s nullglob
          ipas=(artifacts/ios/*.ipa)
          test "${#ipas[@]}" -eq 1
          python3 "$RUNNER_TEMP/control.py" upload-ipa "${ipas[0]}"
        env:
          APPSTORE_API_KEY_ID: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_API_KEY_ID || secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ steps.asc.outputs.source == 'infisical' && env.APPSTORE_API_PRIVATE_KEY || secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  notify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    # actions/checks read let the notifier point at the failing job, step and first error.
    permissions:
      contents: read
      actions: read
      checks: read
    needs: [prepare, ios-build, ios-publish]
    if: ${{ !cancelled() }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Checkout trusted central controls
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Mint source-scoped GitHub App token
        id: app-token
        if: ${{ needs.prepare.outputs.repo != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.name }}
      # TELEGRAM_CHAT_ID lives in the app's Infisical /Build; the bot token is a GitHub secret.
      - name: Read /Build from Infisical staging
        if: ${{ needs.prepare.outputs.project_slug != '' }}
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ needs.prepare.outputs.project_slug }}
          env-slug: staging
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env
      - name: Update TestFlight PR status
        if: ${{ needs.prepare.outputs.repo != '' }}
        uses: ./control/actions/pr-status-comment
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          repository: ${{ needs.prepare.outputs.repo }}
          pr: ${{ needs.prepare.outputs.pr }}
          marker: <!-- central-ios-testflight -->
          mode: upsert
          body: |-
            ${{ needs['ios-publish'].result == 'success' && format('TestFlight {0} (version {1}) uploaded; Apple processing is pending.', needs.prepare.outputs.build_number, needs['ios-build'].outputs.version) || format('TestFlight {0} failed. Build: {1}; publish: {2}.', needs.prepare.outputs.build_number, needs['ios-build'].result, needs['ios-publish'].result) }}
            ${{ needs['ios-build'].outputs.version_verified != 'true' && needs['ios-publish'].result == 'success' && 'Marketing version was not verified against App Store Connect (manual version or lookup failed).' || '' }}
            [Workflow run](${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }})
      - name: Notify Telegram of TestFlight result
        if: ${{ env.TELEGRAM_CHAT_ID != '' }}
        uses: ./control/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ env.TELEGRAM_CHAT_ID }}
          kind: testflight
          status: ${{ needs['ios-publish'].result == 'success' && 'success' || 'failure' }}
          repo: ${{ needs.prepare.outputs.repo }}
          branch: ${{ needs.prepare.outputs.branch }}
          # Version first: the D1 series group needs to see which version went out (KMP's title has none).
          title: "${{ needs['ios-build'].outputs.version != '' && format('Version {0}{1} · {2}', needs['ios-build'].outputs.version, needs.prepare.outputs.force_update == 'true' && ' · FORCE UPDATE' || '', needs.prepare.outputs.title) || needs.prepare.outputs.title }}"
          pr-url: ${{ needs.prepare.outputs.pr_url }}
          build-number: ${{ needs.prepare.outputs.build_number }}
          results: "${{ format('Prepare: {0} · Build: {1} · Publish: {2}', needs.prepare.result, needs['ios-build'].result, needs['ios-publish'].result) }}"
          run-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          github-token: ${{ github.token }}

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
