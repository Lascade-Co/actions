name: Central Build & Debug iOS (TestFlight)
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch || format('PR #{0}', github.event.client_payload.pr) }}"

on:
  repository_dispatch:
    types: [debug-ios]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: debug-ios-${{ github.event.client_payload.repo }}-${{ github.event.client_payload.pr || github.event.client_payload.branch }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    # A cold SwiftPM cache means fetching ~7 GB of package history before the
    # archive starts, and the cache key changes on every Xcode bump, so cold
    # runs recur. 60 minutes killed the job before it could populate the cache,
    # which meant the next run started cold too — the loop never broke.
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_name: ${{ steps.app_meta.outputs.app_name }}
      build_number: ${{ steps.build_number.outputs.build }}
      owner: ${{ steps.repo.outputs.owner }}
      name: ${{ steps.repo.outputs.name }}
      comment_id: ${{ steps.status.outputs.comment-id }}
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        env:
          FULL: ${{ github.event.client_payload.repo }}
        run: |
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      # Scoping the App token is opt-in, because this job runs xcodebuild over
      # unreviewed PR-head code and an owner-wide token there is a large blast
      # radius. A dispatcher that names its private SPM package repos in spm_repos
      # gets a token limited to the source repo plus that list; the PR trigger — the
      # automatic path an outside branch name can reach — does exactly that.
      #
      # With the field absent we emit an EMPTY list, which is not "no repositories":
      # create-github-app-token parses `repositories` with
      #   getInput(...).split(/[\n,]+/).map(trim).filter(x => x !== "")
      # so an empty value and an omitted input both yield [], and [] with `owner`
      # set takes the "token for all repositories owned by <owner>" branch. That
      # keeps the legacy workflow_dispatch payload resolving private SPM deps
      # exactly as it does today.
      - name: Compute token repositories
        id: token_repos
        shell: bash
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
          EXTRA: ${{ github.event.client_payload.spm_repos }}
        run: |
          if [ -n "$EXTRA" ] && [ "$EXTRA" != "null" ]; then
            echo "spm_repos declared; scoping App token to $REPO_NAME,$EXTRA"
            echo "list=$REPO_NAME,$EXTRA" >> "$GITHUB_OUTPUT"
          else
            echo "No spm_repos in payload; App token stays owner-wide"
            echo "list=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.token_repos.outputs.list }}

      - name: Purge previous comments from this workflow
        if: ${{ github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' }}
        uses: actions/github-script@v8
        env:
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.PAYLOAD_REPO.split("/");
            const issue_number = Number(process.env.PAYLOAD_PR);
            const marker = "<!-- central-ios-testflight -->";
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            let deleted = 0;
            for (const c of comments) {
              if ((c.body || "").includes(marker)) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} prior central-ios-testflight comments`);

      - name: Comment on PR that the build started
        id: status
        if: ${{ github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' }}
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          edit-mode: replace
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          body: |
            <!-- central-ios-testflight -->
            🏗️ TestFlight build started.
            Watch progress [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Decide ref to checkout (PR HEAD or named branch)
        id: ref
        shell: bash
        env:
          PR: ${{ github.event.client_payload.pr }}
          BR: ${{ github.event.client_payload.branch }}
        run: |
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            echo "ref=refs/pull/${PR}/head" >> "$GITHUB_OUTPUT"
          elif [ -n "$BR" ]; then
            echo "ref=refs/heads/${BR}" >> "$GITHUB_OUTPUT"
          else
            echo "No PR or branch in payload" >&2
            exit 1
          fi

      - name: Checkout target repo at PR HEAD/branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}
          # This runner reads no git history — it only greps the working tree for
          # MARKETING_VERSION and PRODUCT_NAME. travel-animator-ios is ~1.3 GB, so
          # fetch-depth: 0 cost ~9 minutes per run for nothing.
          fetch-depth: 1

      - name: Configure git for private SPM dependencies
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Extract version and app metadata
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'MARKETING_VERSION' *.xcodeproj/project.pbxproj | grep -v '1.0' | head -1 | sed 's/.*= //;s/;//;s/ //g')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract app metadata
        id: app_meta
        shell: bash
        run: |
          APP_NAME=$(grep -m1 'PRODUCT_NAME' *.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/"//g;s/ //g' || echo "TravelRoute")
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Capture Xcode version
        id: xcode-version
        shell: bash
        run: |
          version="$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g; s/ $//')"
          key="$(printf '%s' "$version" | shasum -a 256 | cut -d' ' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cache-key=$key"   >> "$GITHUB_OUTPUT"

      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: "staging"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env

      - name: Detect Xcode project
        id: detect
        shell: bash
        run: |
          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1 | sed 's|^\./||')
          SCHEME=$(echo "$XCODEPROJ" | sed 's/.xcodeproj//')
          echo "project=$XCODEPROJ" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"     >> "$GITHUB_OUTPUT"

      - name: Decode GoogleService-Info.plist
        shell: bash
        run: |
          PLIST_PATH=$(find . -path "*/GoogleService-Info.plist" -not -path "*/Pods/*" -not -path "*/.build/*" 2>/dev/null | head -1)
          if [ -z "$PLIST_PATH" ]; then
            PLIST_PATH="${{ steps.detect.outputs.scheme }}/GoogleService-Info.plist"
          fi
          echo "${{ env.SERVICE_PLIST_BASE64 }}" | base64 --decode > "$PLIST_PATH"

      - name: Install Apple certificate and provisioning profiles
        run: curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/install_apple_cert.sh | bash

      - name: Install additional provisioning profiles
        shell: bash
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -n "$IOS_SHARE_EXT_PROVISION_PROFILE_BASE64" ]; then
            TEMP_PROFILE=$(mktemp)
            echo "$IOS_SHARE_EXT_PROVISION_PROFILE_BASE64" | base64 --decode > "$TEMP_PROFILE"
            UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
              <<< "$(security cms -D -i "$TEMP_PROFILE")")
            cp "$TEMP_PROFILE" "$PROFILES_DIR/$UUID.mobileprovision"
            rm -f "$TEMP_PROFILE"
            echo "SHARE_EXT_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
            echo "Installed share extension profile with UUID $UUID"
          fi

      - name: Resolve team and bundle identifiers
        id: ids
        shell: bash
        run: |
          TEAM="${IOS_TEAM_ID:-${APP_PROFILE_TEAM_ID:-}}"
          BUNDLE="${IOS_BUNDLE_ID:-${APP_PROFILE_BUNDLE_ID:-}}"
          : "${TEAM:?no IOS_TEAM_ID in Infisical and none derivable from the profile}"
          : "${BUNDLE:?no IOS_BUNDLE_ID in Infisical and none derivable from the profile}"
          echo "Team $TEAM, bundle $BUNDLE"
          echo "team=$TEAM"     >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Switch Xcode project to manual signing
        env:
          PBXPROJ_PATH: ${{ steps.detect.outputs.project }}/project.pbxproj
          IOS_TEAM_ID: ${{ steps.ids.outputs.team }}
        run: curl -sSL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/ios/fix_ios_signing.py | python3 -

      - name: Generate ExportOptions.plist
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Clear dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string ${{ steps.ids.outputs.team }}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${{ steps.ids.outputs.bundle }} string ${{ env.APP_PROFILE_UUID }}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${{ steps.ids.outputs.bundle }}.OneSignalNotificationServiceExtension string ${{ env.NSE_PROFILE_UUID }}" ExportOptions.plist
          if [ -n "${{ env.SHARE_EXT_PROFILE_UUID }}" ]; then
            /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:${{ steps.ids.outputs.bundle }}.MapLinkShareExtension string ${{ env.SHARE_EXT_PROFILE_UUID }}" ExportOptions.plist
          fi

      # Let SwiftPM populate its own caches and DerivedData. Every previous
      # attempt to pre-stage them by hand was dead weight -- see the commit
      # message and docs/adr/0010.
      - name: Resolve SPM dependencies
        id: spm
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ steps.detect.outputs.project }}" \
            -scheme "${{ steps.detect.outputs.scheme }}"

      - name: Compute build number
        id: build_number
        shell: bash
        env:
          PR: ${{ github.event.client_payload.pr }}
        run: |
          BUILD=$(( 1000 + ${{ github.run_number }} ))
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then BUILD="${BUILD}.${PR}"; fi
          echo "Build number $BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Archive
        id: archive
        run: |
          xcodebuild archive \
            -project "${{ steps.detect.outputs.project }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG $(inherited)' \
            GCC_PREPROCESSOR_DEFINITIONS='DEBUG=1 $(inherited)'

      - name: Export IPA
        id: export
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \

      - name: Upload dSYMs to Firebase Crashlytics
        shell: bash
        run: |
          # firebase-ios-sdk now lives wherever SwiftPM put it, under DerivedData.
          # The project's own Crashlytics build phase already uploads dSYMs during
          # the archive; this step is a backstop and stays best-effort.
          UPLOAD_SYMBOLS=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/SourcePackages/checkouts/firebase-ios-sdk/*" \
            -name "upload-symbols" -type f 2>/dev/null | head -1)
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "Warning: upload-symbols not found, skipping dSYM upload"
            exit 0
          fi
          chmod +x "$UPLOAD_SYMBOLS"

          PLIST=$(find . -name "GoogleService-Info.plist" -not -path "*/Pods/*" -not -path "*/.build/*" | head -1)

          "$UPLOAD_SYMBOLS" -gsp "$PLIST" -p ios build/App.xcarchive/dSYMs

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-debug
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Comment on PR if the build failed
        if: ${{ failure() && github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' && steps.app-token.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          PAYLOAD_PR: ${{ github.event.client_payload.pr }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const outcomes = {
              "SPM resolution": "${{ steps.spm.outcome }}",
              "Archive":        "${{ steps.archive.outcome }}",
              "Export IPA":     "${{ steps.export.outcome }}",
            };
            const stage = Object.keys(outcomes).find(k => outcomes[k] === "failure") || "Build";
            const [owner, repo] = process.env.PAYLOAD_REPO.split("/");
            const issue_number = Number(process.env.PAYLOAD_PR);
            const body = [
              "<!-- central-ios-testflight -->",
              `❌ **${stage}** failed.`,
              `[Check logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join("\n");
            const commentId = Number("${{ steps.status.outputs.comment-id }}");
            if (commentId) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: commentId, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  publish:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ needs.build.outputs.owner }}
          repositories: ${{ needs.build.outputs.name }}

      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: "staging"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-debug

      - name: Locate IPA
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find . -maxdepth 2 -name "*.ipa" | head -n 1)
          : "${IPA:?Missing IPA}"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect (TestFlight)
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
          xcrun altool --upload-app \
            -f "${{ steps.assets.outputs.ipa }}" \
            --type ios \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Comment on PR with the TestFlight build
        if: ${{ github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' && steps.app-token.outcome == 'success' }}
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          comment-id: ${{ needs.build.outputs.comment_id }}
          edit-mode: replace
          body: |
            <!-- central-ios-testflight -->
            ✅ Uploaded to TestFlight — **${{ needs.build.outputs.app_name }}**,
            version `${{ needs.build.outputs.version }}`, build `${{ needs.build.outputs.build_number }}`.

            Find it in TestFlight under version ${{ needs.build.outputs.version }} → build ${{ needs.build.outputs.build_number }}.
            Processing takes a few minutes after this comment appears.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # The heredoc below is unquoted so shell variables expand; it must therefore
      # contain no ${{ }} interpolation of payload- or build-derived text, or a
      # branch named `feat/x$(id)` would execute in the job that holds the App
      # Store signing key. Every such value arrives via env: and is HTML-escaped.
      - name: Notify Telegram (success)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PR_TITLE: ${{ github.event.client_payload.title }}
          BRANCH: ${{ github.event.client_payload.branch }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          # & first: escaping < and > introduces ampersands we must not re-escape.
          html_escape() {
            local s="${1//&/&amp;}"
            s="${s//</&lt;}"
            printf '%s' "${s//>/&gt;}"
          }
          ESCAPED_TITLE="$(html_escape "$PR_TITLE")"
          ESCAPED_BRANCH="$(html_escape "$BRANCH")"
          ESCAPED_APP="$(html_escape "$APP_NAME")"
          ESCAPED_VERSION="$(html_escape "$APP_VERSION")"
          ESCAPED_BUILD="$(html_escape "$BUILD_NUMBER")"
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=html \
            -d disable_web_page_preview=true \
            -d text="$(cat <<MSG
          <b>iOS build uploaded to TestFlight</b>

          <b>App:</b> ${ESCAPED_APP}
          <b>Version:</b> ${ESCAPED_VERSION}
          <b>Build:</b> ${ESCAPED_BUILD}
          <b>Branch:</b> ${ESCAPED_BRANCH}
          <b>PR:</b> ${ESCAPED_TITLE:-n/a}
          MSG
          )"

      # Same rule as the success notifier: nothing payload- or build-derived may be
      # interpolated straight into this unquoted heredoc.
      - name: Notify Telegram (FAILURE)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PR_TITLE: ${{ github.event.client_payload.title }}
          BRANCH: ${{ github.event.client_payload.branch }}
          PAYLOAD_REPO: ${{ github.event.client_payload.repo }}
          APP_NAME: ${{ needs.build.outputs.app_name }}
        run: |
          # & first: escaping < and > introduces ampersands we must not re-escape.
          html_escape() {
            local s="${1//&/&amp;}"
            s="${s//</&lt;}"
            printf '%s' "${s//>/&gt;}"
          }
          ESCAPED_TITLE="$(html_escape "$PR_TITLE")"
          ESCAPED_BRANCH="$(html_escape "$BRANCH")"
          ESCAPED_REPO="$(html_escape "$PAYLOAD_REPO")"
          ESCAPED_APP="$(html_escape "$APP_NAME")"
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=html \
            -d disable_web_page_preview=true \
            -d text="$(cat <<MSG
          <b>TestFlight upload failed</b>

          <b>App:</b> ${ESCAPED_APP}
          <b>Repo:</b> <code>${ESCAPED_REPO}</code>
          <b>Branch:</b> ${ESCAPED_BRANCH}
          <b>PR:</b> ${ESCAPED_TITLE:-n/a}

          <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View logs</a>
          MSG
          )"

      - name: Comment on PR if the upload failed
        if: ${{ failure() && github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' && steps.app-token.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          comment-id: ${{ needs.build.outputs.comment_id }}
          edit-mode: replace
          body: |
            <!-- central-ios-testflight -->
            ❌ **TestFlight upload** failed for build `${{ needs.build.outputs.build_number }}`.
            [Check logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
