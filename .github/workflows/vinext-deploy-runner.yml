name: Vinext Deploy
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.pr_number && format('pr #{0}{1}', github.event.client_payload.pr_number, github.event.client_payload.pr_action == 'closed' && ' cleanup' || '') || github.event.client_payload.branch == 'main' && 'production' || github.event.client_payload.branch == 'dev' && 'staging' || 'invalid branch' }} · Vinext"

on:
  repository_dispatch:
    types: [vinext-deploy]

permissions:
  contents: read

defaults:
  run:
    shell: seal-bash {0}

# Routes, by client_payload:
# - no pr_number: the dev/main deploy (prepare -> build -> deploy), unchanged.
# - pr_number, pr_action != closed: a PR Preview through the same jobs. The plan
#   target is `pr`, which deploys only `wrangler preview --name pr-<N>`.
# - pr_number, pr_action == closed: cleanup-source -> cleanup only (no build).
# All jobs use the `production` environment: it is where this repository keeps the
# central deployment secrets (seal policy), not a statement about the target.
jobs:
  prepare:
    if: ${{ github.event.client_payload.pr_action != 'closed' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      worker_key: ${{ steps.prepare.outputs.worker_key }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download central deployment controls at the runner commit
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p control/scripts/vinext
          for file in scripts/vinext/{cli,config,build,deploy,secrets,source}.mjs; do
            rm -f "control/$file.tmp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/$file" -o "control/$file.tmp"
            test -s "control/$file.tmp"
            mv "control/$file.tmp" "control/$file"
          done

      - name: Validate dispatch before minting a source token
        id: preflight
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node control/scripts/vinext/cli.mjs preflight

      - name: Mint source configuration and status token
        id: status-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.preflight.outputs.repo_name }}
          permission-contents: read
          permission-statuses: write
          # PRs only: read the PR head (isCurrent) and report a failure comment.
          permission-pull-requests: ${{ github.event.client_payload.pr_number && 'write' || '' }}

      - name: Resolve source Worker and Infisical deployment settings
        id: prepare
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: node control/scripts/vinext/cli.mjs prepare

      # PRs also check that the head targets its base branch's Worker and account.
      - name: Verify requested commit is the branch or PR head
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs verify-source

      - name: Mark source commit deployment pending
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          STATUS_STATE: pending
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node control/scripts/vinext/cli.mjs status

      # vinext/preview is a required check, so a PR that fails before the deploy
      # job still gets a failed status. The comment is update-only here: this job
      # is outside the deploy queue, where comments are created. dev/main unchanged.
      - name: Report a PR Preview preparation failure
        if: ${{ failure() && github.event.client_payload.pr_number && steps.status-token.outcome == 'success' }}
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.status-token.outputs.token }}
          STATUS_STATE: failure
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_MODE: update-only
          # The comment is matched by this app's bot login, <app-slug>[bot].
          APP_SLUG: ${{ steps.status-token.outputs.app-slug }}
        run: |
          node control/scripts/vinext/cli.mjs status
          node control/scripts/vinext/cli.mjs comment

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: prepare
    if: ${{ github.event.client_payload.pr_action != 'closed' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Set up Node for deployment controls
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download central deployment controls at the runner commit
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p control/scripts/vinext
          for file in scripts/vinext/{cli,config,build,deploy,secrets,source}.mjs; do
            rm -f "control/$file.tmp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/$file" -o "control/$file.tmp"
            test -s "control/$file.tmp"
            mv "control/$file.tmp" "control/$file"
          done

      - name: Validate dispatch before minting a source token
        id: preflight
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node control/scripts/vinext/cli.mjs preflight

      - name: Mint read-only source configuration token
        id: config-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.preflight.outputs.repo_name }}
          permission-contents: read

      - name: Resolve source Worker and Infisical deployment settings
        id: prepare
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.config-token.outputs.token }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: node control/scripts/vinext/cli.mjs prepare

      - name: Set up project Node version
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(steps.prepare.outputs.plan).project.node_version }}
          package-manager-cache: false

      - name: Mint read-only source and submodule checkout token
        id: checkout-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.prepare.outputs.repositories }}
          permission-contents: read
          # PRs only: the build re-checks the PR head (isCurrent) with this token.
          permission-pull-requests: ${{ github.event.client_payload.pr_number && 'read' || '' }}

      - name: Checkout requested source and recorded submodule revisions
        uses: actions/checkout@v7
        with:
          repository: ${{ fromJSON(steps.prepare.outputs.plan).repo }}
          ref: ${{ fromJSON(steps.prepare.outputs.plan).sha }}
          token: ${{ steps.checkout-token.outputs.token }}
          path: app
          submodules: recursive
          fetch-depth: 1
          # Scoped read-only token remains available for recursive submodule cleanup.
          persist-credentials: true

      - name: Set up the project's pinned pnpm version
        if: ${{ fromJSON(steps.prepare.outputs.plan).project.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: app/${{ fromJSON(steps.prepare.outputs.plan).project.working_directory }}/package.json
          standalone: false
          run_install: false
          cache: false

      - name: Enable the project's pinned npm or Yarn version
        if: ${{ fromJSON(steps.prepare.outputs.plan).project.package_manager != 'pnpm' }}
        env:
          PACKAGE_MANAGER: ${{ fromJSON(steps.prepare.outputs.plan).project.package_manager }}
        run: |
          npm install --global --no-audit --no-fund corepack@0.36.0
          corepack enable "$PACKAGE_MANAGER"

      - name: Import environment configuration from Infisical
        # The official action's file writer does not escape quoted values. The
        # central helper preserves values as JSON and selects only build keys.
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_ENV_FILE: ${{ github.workspace }}/vinext-build.json
          SECRET_KIND: build
        run: node control/scripts/vinext/cli.mjs secrets

      - name: Build and prepare a deployment-only bundle
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          APP_ROOT: ${{ github.workspace }}/app
          INFISICAL_ENV_FILE: ${{ github.workspace }}/vinext-build.json
          BUNDLE_ROOT: ${{ github.workspace }}/bundle
          GH_TOKEN: ${{ steps.checkout-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs build

      - name: Seal sanitized deployment bundle
        id: pack_1
        run: seal-pack --include-hidden "vinext-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" bundle/

      - name: Upload sanitized deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: vinext-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seal/art/vinext-bundle-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove temporary environment file
        if: ${{ always() }}
        run: rm -f "$GITHUB_WORKSPACE/vinext-build.json"

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: [prepare, build]
    # Also report failures from the separate build runner without fetching deployment secrets.
    if: ${{ always() && needs.prepare.result == 'success' && github.event.client_payload.pr_action != 'closed' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: vinext-worker-${{ needs.prepare.outputs.worker_key }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download central deployment controls at the runner commit
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p control/scripts/vinext
          for file in scripts/vinext/{cli,config,build,deploy,secrets,source}.mjs; do
            rm -f "control/$file.tmp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/$file" -o "control/$file.tmp"
            test -s "control/$file.tmp"
            mv "control/$file.tmp" "control/$file"
          done

      - name: Validate dispatch before minting a source token
        id: preflight
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node control/scripts/vinext/cli.mjs preflight

      - name: Mint source configuration, verification, and status token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.preflight.outputs.repo_name }}
          permission-contents: read
          permission-statuses: write
          # PRs only: read the PR head (isCurrent) and edit the PR comment.
          permission-pull-requests: ${{ github.event.client_payload.pr_number && 'write' || '' }}

      - name: Resolve source Worker and Infisical deployment settings
        id: prepare
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
        run: node control/scripts/vinext/cli.mjs prepare

      - name: Install pinned standalone Wrangler
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' }}
        env:
          WRANGLER_VERSION: ${{ fromJSON(steps.prepare.outputs.plan).project.wrangler_version }}
        run: npm install --prefix "$RUNNER_TEMP/vinext-tools" --no-audit --no-fund "wrangler@$WRANGLER_VERSION"

      - name: Download deployment bundle
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: vinext-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: bundle

      - name: Unseal deployment bundle
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' }}
        env:
          REPO_AGE_KEY: ${{ secrets.REPO_AGE_KEY }}
        run: seal-unpack bundle

      - name: Import runtime secrets from Infisical
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' }}
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_DOMAIN: ${{ secrets.INFISICAL_DOMAIN }}
          INFISICAL_ENV_FILE: ${{ github.workspace }}/vinext-runtime.json
          SECRET_KIND: runtime
        run: node control/scripts/vinext/cli.mjs secrets

      # dev/main only. cli.mjs refuses any plan target outside DEPLOY_TARGETS.
      - name: Deploy the preview or production version and verify it
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.plan).target != 'pr' }}
        id: deploy
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          DEPLOY_TARGETS: production,staging
          BUNDLE_ROOT: ${{ github.workspace }}/bundle
          INFISICAL_ENV_FILE: ${{ github.workspace }}/vinext-runtime.json
          WRANGLER_BIN: ${{ runner.temp }}/vinext-tools/node_modules/wrangler/bin/wrangler.js
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs deploy

      # PRs only: `wrangler preview --name pr-<N>`; production must stay unchanged.
      - name: Deploy the PR Preview and verify production is unchanged
        if: ${{ needs.build.result == 'success' && steps.prepare.outcome == 'success' && fromJSON(steps.prepare.outputs.plan).target == 'pr' }}
        id: deploy_pr
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          DEPLOY_TARGETS: pr
          BUNDLE_ROOT: ${{ github.workspace }}/bundle
          INFISICAL_ENV_FILE: ${{ github.workspace }}/vinext-runtime.json
          WRANGLER_BIN: ${{ runner.temp }}/vinext-tools/node_modules/wrangler/bin/wrangler.js
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs deploy

      - name: Report final deployment status to source commit
        if: ${{ always() && steps.source-token.outcome == 'success' }}
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          STATUS_STATE: ${{ needs.build.result == 'success' && (steps.deploy.outcome == 'success' || steps.deploy_pr.outcome == 'success') && 'success' || 'failure' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STATE: ${{ steps.deploy.outputs.state || steps.deploy_pr.outputs.state }}
        run: node control/scripts/vinext/cli.mjs status

      - name: Report the PR Preview in its pull request comment
        if: ${{ always() && github.event.client_payload.pr_number && steps.source-token.outcome == 'success' }}
        env:
          PLAN_JSON: ${{ steps.prepare.outputs.plan }}
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          STATUS_STATE: ${{ needs.build.result == 'success' && steps.deploy_pr.outcome == 'success' && 'success' || 'failure' }}
          DEPLOY_STATE: ${{ steps.deploy_pr.outputs.state }}
          PREVIEW_URL: ${{ steps.deploy_pr.outputs.preview_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_SLUG: ${{ steps.source-token.outputs.app-slug }}
        run: node control/scripts/vinext/cli.mjs comment

      - name: Remove temporary runtime secrets and deployment bundle
        if: ${{ always() }}
        run: |
          rm -f "$GITHUB_WORKSPACE/vinext-runtime.json"
          rm -rf "$GITHUB_WORKSPACE/bundle"

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  # Closed PR: check the dispatch is the PR's own last head into main or dev, and
  # resolve the Worker from the PR's base commit so the delete can join that
  # Worker's deploy queue. A reopened PR is a no-op (state=reopened).
  # No build, no Infisical, no prepare. GET /pulls/{n} accepts contents: read.
  cleanup-source:
    if: ${{ github.event.client_payload.pr_action == 'closed' && github.event.client_payload.pr_number }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      worker_key: ${{ steps.resolve.outputs.worker_key }}
      # `reopened` when the PR is open again: nothing to clean up.
      state: ${{ steps.resolve.outputs.state }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download central deployment controls at the runner commit
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p control/scripts/vinext
          for file in scripts/vinext/{cli,config,build,deploy,secrets,source}.mjs; do
            rm -f "control/$file.tmp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/$file" -o "control/$file.tmp"
            test -s "control/$file.tmp"
            mv "control/$file.tmp" "control/$file"
          done

      - name: Validate dispatch before minting a source token
        id: preflight
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node control/scripts/vinext/cli.mjs preflight

      - name: Mint read-only source configuration token
        id: config-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.preflight.outputs.repo_name }}
          permission-contents: read

      - name: Resolve the closed PR's Worker
        id: resolve
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.config-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs cleanup-resolve

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore

  # Deletes Preview pr-<N>. A Preview that never existed (a draft PR) is a
  # successful no-op. Shares the deploy queue, so it cannot race a PR deploy.
  cleanup:
    needs: cleanup-source
    if: ${{ github.event.client_payload.pr_action == 'closed' && github.event.client_payload.pr_number && needs.cleanup-source.result == 'success' && needs.cleanup-source.outputs.state != 'reopened' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: vinext-worker-${{ needs.cleanup-source.outputs.worker_key }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download central deployment controls at the runner commit
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p control/scripts/vinext
          for file in scripts/vinext/{cli,config,build,deploy,secrets,source}.mjs; do
            rm -f "control/$file.tmp"
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 60 --connect-timeout 10 --max-time 20 "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/$file" -o "control/$file.tmp"
            test -s "control/$file.tmp"
            mv "control/$file.tmp" "control/$file"
          done

      - name: Validate dispatch before minting a source token
        id: preflight
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node control/scripts/vinext/cli.mjs preflight

      - name: Mint source configuration and PR comment token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.preflight.outputs.owner }}
          repositories: ${{ steps.preflight.outputs.repo_name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Resolve the closed PR's Worker and Wrangler version
        id: resolve
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: node control/scripts/vinext/cli.mjs cleanup-resolve

      - name: Install pinned standalone Wrangler
        if: ${{ steps.resolve.outputs.state != 'reopened' }}
        env:
          WRANGLER_VERSION: ${{ steps.resolve.outputs.wrangler_version }}
        run: npm install --prefix "$RUNNER_TEMP/vinext-tools" --no-audit --no-fund "wrangler@$WRANGLER_VERSION"

      - name: Delete the PR Preview and update the PR comment
        if: ${{ steps.resolve.outputs.state != 'reopened' }}
        env:
          PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_BIN: ${{ runner.temp }}/vinext-tools/node_modules/wrangler/bin/wrangler.js
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APP_SLUG: ${{ steps.source-token.outputs.app-slug }}
        run: node control/scripts/vinext/cli.mjs cleanup

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
