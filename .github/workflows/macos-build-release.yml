name: Central Build & Release macOS DMG
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch }}"

# Builds a Developer ID signed, notarized and stapled DMG for a macOS app and attaches it to a
# GitHub Release in the (private) SOURCE repo. Trigger: triggers/macos-build-release.yml.
#
# This repo is public, so its run logs and workflow artifacts are visible to anyone. Step output is
# sealed (docs/sealed-output.md), and the DMG never touches actions/upload-artifact: build, sign,
# notarize and release happen in one job, and the only copy that leaves the runner goes to the
# source repo's release.
#
# The source repo must provide scripts/release.sh, which reads RELEASE_TEAM_ID, RELEASE_CERT
# (DER .cer), RELEASE_CERT_KEY, NOTARY_KEY (.p8), NOTARY_KEY_ID and NOTARY_ISSUER, and writes
# .build/release/<name>-<version>.dmg, and an increment_version.sh at its root (as for iOS/Android)
# that bumps MARKETING_VERSION and CURRENT_PROJECT_VERSION in Config/Product.xcconfig. The release
# is tagged v<MARKETING_VERSION>; after it succeeds the bump is committed ([skip ci]) to the branch.
#
# Infisical (project = client_payload.project_slug, env prod, path /Build):
#   MACOS_TEAM_ID                       Apple Developer Team ID
#   MACOS_DEVELOPER_ID_CERT_BASE64      base64 of the Developer ID Application certificate (.cer, DER)
#   MACOS_DEVELOPER_ID_KEY_BASE64       base64 of that certificate's private key (PEM)
#   SERVICE_PLIST_BASE64                base64 of GoogleService-Info.plist (optional if the app allows it)
#   APPSTORE_API_KEY_ID / APPSTORE_API_PRIVATE_KEY / APPSTORE_ISSUER_ID
#                                       optional notary API key; falls back to the org secrets

on:
  repository_dispatch:
    types: [release-macos]

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.event.client_payload.repo }}
  # Never cancel a run mid-notarization or between the release and the version bump; queue instead.
  cancel-in-progress: false

defaults:
  run:
    shell: "seal-bash-e {0}"

jobs:
  release:
    runs-on: macos-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"

      - name: Extract owner/repo
        id: repo
        shell: "seal-bash {0}"
        env:
          FULL: ${{ github.event.client_payload.repo }}
        run: |
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      # Scoped to the source repo only: it checks out the code and creates the release there.
      # The action masks the token it mints.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Checkout source repo @ branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: refs/heads/${{ github.event.client_payload.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: src

      - name: Read version and check the tag is free
        id: version
        shell: "seal-bash {0}"
        working-directory: src
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' Config/Product.xcconfig)
          APP_NAME=$(sed -n 's/^PRODUCT_DISPLAY_NAME *= *//p' Config/Product.xcconfig)
          [ -n "$VERSION" ] && [ -n "$APP_NAME" ] || { echo "::error::MARKETING_VERSION/PRODUCT_DISPLAY_NAME missing"; exit 1; }
          if gh release view "v$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists in the source repo. Bump MARKETING_VERSION in Config/Product.xcconfig."
            exit 1
          fi
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The action masks every value it exports (core.setSecret before exportVariable).
      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: "prod"
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          secret-path: /Build
          export-type: env

      # Belt and braces on top of the Infisical masks, before any third-party step runs. The
      # multi-line notary key is masked line by line.
      - name: Mask build secrets
        shell: "seal-bash {0}"
        run: |
          for v in MACOS_TEAM_ID MACOS_DEVELOPER_ID_CERT_BASE64 MACOS_DEVELOPER_ID_KEY_BASE64 \
                   SERVICE_PLIST_BASE64 APPSTORE_API_KEY_ID APPSTORE_ISSUER_ID; do
            if [ -n "${!v:-}" ]; then echo "::add-mask::${!v}"; fi
          done
          printf '%s\n' "${APPSTORE_API_PRIVATE_KEY:-}" | while IFS= read -r line; do
            case "$line" in ""|-----*) ;; *) echo "::add-mask::$line" ;; esac
          done

      # Writes signing files under RUNNER_TEMP (outside the checkout), masks and exports the values
      # release.sh reads, and trusts Apple's Developer ID G2 intermediate. Nothing is echoed.
      - name: Write signing material
        shell: "seal-bash {0}"
        env:
          FALLBACK_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          FALLBACK_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          FALLBACK_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/macos/write_signing.sh \
            | bash -s -- src/App/GoogleService-Info.plist

      - name: Build, sign, notarize and staple DMG
        id: build
        shell: "seal-bash {0}"
        working-directory: src
        env:
          DMG: .build/release/${{ steps.version.outputs.app_name }}-${{ steps.version.outputs.version }}.dmg
        run: |
          set -euo pipefail
          scripts/release.sh
          [ -f "$DMG" ] || { echo "::error::release.sh did not produce $DMG"; exit 1; }
          {
            echo "dmg=$PWD/$DMG"
            echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release in source repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.event.client_payload.repo }}
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.build.outputs.sha }}
          name: v${{ steps.version.outputs.version }}
          body: "Developer ID signed, notarized and stapled DMG. SHA-256: `${{ steps.build.outputs.sha256 }}`"
          files: ${{ steps.build.outputs.dmg }}
          fail_on_unmatched_files: true

      # Like the iOS release: after a successful release, bump the version on the branch with the
      # source repo's increment_version.sh. A fresh checkout picks up commits pushed during the build.
      - name: Checkout source repo for version bump
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: refs/heads/${{ github.event.client_payload.branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: bump

      - name: Bump version and push
        shell: "seal-bash {0}"
        working-directory: bump
        env:
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          set -euo pipefail
          bash increment_version.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Config/Product.xcconfig
          git commit -m "[skip ci] Increment version to $(sed -n 's/^MARKETING_VERSION *= *//p' Config/Product.xcconfig)"
          git push origin "HEAD:$BRANCH"

      - name: Remove signing material
        if: always()
        shell: "seal-bash {0}"
        run: rm -rf "$RUNNER_TEMP/signing" src/App/GoogleService-Info.plist src/.build/release

      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
