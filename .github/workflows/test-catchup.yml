name: Test catchup email

# Separate from daily-catchup.yml on purpose: a failing test must never block the daily send.
on:
  push:
    paths: ["scripts/catchup/**", "data/CATCHUP_REPORT.md", "data/catchup_icons.json", "data/catchup_people.json"]
  pull_request:
    paths: ["scripts/catchup/**", "data/CATCHUP_REPORT.md", "data/catchup_icons.json", "data/catchup_people.json"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/catchup -p 'test_catchup_email.py' -v
