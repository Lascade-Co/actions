# Source owns builds/versioning; central owns credentials, caches and publication.
name: Central KMP Release
run-name: ${{ format('KMP release · {0} · {1}', github.event.client_payload.repo, github.event.client_payload.sha) }}
'on':
  repository_dispatch:
    types:
    - kmp-release
permissions:
  contents: read
  packages: write
  actions: read
  checks: read
concurrency:
  group: kmp-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.source.outputs.repo }}
      owner: ${{ steps.source.outputs.owner }}
      name: ${{ steps.source.outputs.name }}
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
      project_slug: ${{ steps.source.outputs.project_slug }}
      skip: ${{ steps.source.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      kotlin_version: ${{ steps.metadata.outputs.kotlin_version }}
      angle_revision: ${{ steps.metadata.outputs.angle_revision }}
    steps:
    - name: Checkout trusted central controls
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: control
        persist-credentials: false
    - name: Validate trusted release scope before credentials
      id: payload
      run: python3 control/scripts/kmp/release.py validate
    - name: Mint source-scoped GitHub App token
      uses: actions/create-github-app-token@v3.3.0
      with:
        client-id: ${{ secrets.CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
        owner: ${{ steps.payload.outputs.owner }}
        repositories: ${{ steps.payload.outputs.name }}
      id: app-token
    - name: Pin main and reject stale dispatches or bot bump loops
      id: source
      run: python3 control/scripts/kmp/release.py resolve
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: Checkout pinned source commit
      uses: actions/checkout@v7
      with:
        repository: ${{ steps.source.outputs.repo }}
        ref: ${{ steps.source.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: source
        persist-credentials: false
        fetch-depth: 0
      if: ${{ steps.source.outputs.skip != 'true' }}
    - name: Compute and apply source-owned version bump
      id: version
      run: python3 scripts/ci/release_version.py --apply
      working-directory: source
      if: ${{ steps.source.outputs.skip != 'true' }}
    - name: Read source dependency identities
      id: metadata
      run: python3 ../control/scripts/kmp/release.py metadata
      working-directory: source
      if: ${{ steps.source.outputs.skip != 'true' }}
    - name: Select updated release notes or construct Claude diff prompt
      id: notes
      run: python3 ../control/scripts/kmp/release.py notes --template ../control/data/RELEASE_NOTES.md --prompt ../release-prompt.md
      working-directory: source
      if: ${{ steps.source.outputs.skip != 'true' }}
    - name: Install release-notes generator dependencies
      if: ${{ steps.source.outputs.skip != 'true' && steps.notes.outputs.outdated == 'true' }}
      run: python3 -m pip install -r control/scripts/ai/requirements.txt
    - name: Generate complete release notes within Play limit
      if: ${{ steps.source.outputs.skip != 'true' && steps.notes.outputs.outdated == 'true' }}
      run: python3 control/scripts/android/release_notes.py --prompt release-prompt.md --out source/releasenotes.txt
      env:
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    - name: Validate nonempty English release notes without truncation
      run: python3 control/scripts/kmp/release.py check-notes source/releasenotes.txt
      if: ${{ steps.source.outputs.skip != 'true' }}
    - name: Retain one notes text for both stores
      uses: actions/upload-artifact@v7
      with:
        name: kmp-release-notes
        path: source/releasenotes.txt
        if-no-files-found: error
        retention-days: 7
      if: ${{ steps.source.outputs.skip != 'true' }}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
    needs:
    - prepare
    steps:
    - name: Checkout trusted central controls
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: control
        persist-credentials: false
    - name: Mint source-scoped GitHub App token
      uses: actions/create-github-app-token@v3.3.0
      with:
        client-id: ${{ secrets.CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
        owner: ${{ needs.prepare.outputs.owner }}
        repositories: ${{ needs.prepare.outputs.name }}
      id: app-token
    - name: Checkout pinned source commit
      uses: actions/checkout@v7
      with:
        repository: ${{ needs.prepare.outputs.repo }}
        ref: ${{ needs.prepare.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: source
        persist-credentials: false
        fetch-depth: 0
    - name: Apply the prepared source-owned version pair
      run: python3 scripts/ci/release_version.py --apply --version "$VERSION" --build-number "$BUILD_NUMBER"
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
        BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    - name: Read /Local-Properties from Infisical prod
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: universal
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ needs.prepare.outputs.project_slug }}
        env-slug: prod
        domain: ${{ secrets.INFISICAL_DOMAIN }}
        secret-path: /Local-Properties
        export-type: file
        file-output-path: /source/.ci-local.env
    - name: Render local.properties without shell evaluation
      run: python3 ../control/scripts/kmp/control.py local-properties --input .ci-local.env --output local.properties
    - name: Read /Build from Infisical prod
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: universal
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ needs.prepare.outputs.project_slug }}
        env-slug: prod
        domain: ${{ secrets.INFISICAL_DOMAIN }}
        secret-path: /Build
        export-type: env
    - name: Install production signing and Firebase inputs
      run: python3 ../control/scripts/kmp/release.py android-inputs
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up small Gradle configuration and build caches
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-cleanup: never
        gradle-home-cache-includes: |-
          caches/build-cache-1
          notifications
        gradle-home-cache-excludes: |-
          wrapper
          caches/modules-2
          caches/transforms-*
          caches/*/transforms
    - name: Restore gradle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: restore
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'gradle') }}
        key: ${{ format('deps-{0}-{1}', runner.arch, hashFiles('source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties',
          'source/**/*.gradle.kts', 'source/gradle.properties')) }}
        fallback-key: latest
        paths: |-
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        token: ${{ github.token }}
      id: gradle-cache
    - name: Build signed production AAB, universal APK, symbols and R8 mapping
      run: python3 scripts/ci/android_release.py
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      id: build
    - name: Retain all Android release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: kmp-release-android
        path: source/build/ci/release/android/
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Publish gradle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: publish
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'gradle') }}
        key: ${{ format('deps-{0}-{1}', runner.arch, hashFiles('source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties',
          'source/**/*.gradle.kts', 'source/gradle.properties')) }}
        fallback-key: latest
        paths: |-
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        token: ${{ github.token }}
      continue-on-error: true
      if: ${{ steps.gradle-cache.outputs.hit != 'true' }}
    - name: Retain android diagnostics
      uses: actions/upload-artifact@v7
      with:
        name: android-diagnostics
        path: |-
          source/build/ci/release/**/*.json
          source/build/ci/release/**/*.txt
          source/build/ci/release/**/*.log
        if-no-files-found: warn
        retention-days: 7
        overwrite: true
      if: ${{ always() }}
    if: ${{ needs.prepare.outputs.skip != 'true' }}
  ios-build:
    runs-on: macos-26-xlarge
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
    needs:
    - prepare
    steps:
    - name: Checkout trusted central controls
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: control
        persist-credentials: false
    - name: Mint source-scoped GitHub App token
      uses: actions/create-github-app-token@v3.3.0
      with:
        client-id: ${{ secrets.CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
        owner: ${{ needs.prepare.outputs.owner }}
        repositories: ${{ needs.prepare.outputs.name }}
      id: app-token
    - name: Checkout pinned source commit
      uses: actions/checkout@v7
      with:
        repository: ${{ needs.prepare.outputs.repo }}
        ref: ${{ needs.prepare.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: source
        persist-credentials: false
        fetch-depth: 0
    - name: Apply the prepared source-owned version pair
      run: python3 scripts/ci/release_version.py --apply --version "$VERSION" --build-number "$BUILD_NUMBER"
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
        BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    - name: Read /Local-Properties from Infisical prod
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: universal
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ needs.prepare.outputs.project_slug }}
        env-slug: prod
        domain: ${{ secrets.INFISICAL_DOMAIN }}
        secret-path: /Local-Properties
        export-type: file
        file-output-path: /source/.ci-local.env
    - name: Render local.properties without shell evaluation
      run: python3 ../control/scripts/kmp/control.py local-properties --input .ci-local.env --output local.properties
    - name: Read /Build from Infisical prod
      uses: Infisical/secrets-action@v1.0.18
      with:
        method: universal
        client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
        client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ needs.prepare.outputs.project_slug }}
        env-slug: prod
        domain: ${{ secrets.INFISICAL_DOMAIN }}
        secret-path: /Build
        export-type: env
    - name: Install production Firebase plist
      run: python3 ../control/scripts/kmp/release.py ios-inputs
    - name: Pin Xcode 26.6
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up small Gradle configuration and build caches
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-cleanup: never
        gradle-home-cache-includes: |-
          caches/build-cache-1
          notifications
        gradle-home-cache-excludes: |-
          wrapper
          caches/modules-2
          caches/transforms-*
          caches/*/transforms
    - name: Restore gradle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: restore
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'gradle') }}
        key: ${{ format('deps-{0}-{1}', runner.arch, hashFiles('source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties',
          'source/**/*.gradle.kts', 'source/gradle.properties')) }}
        fallback-key: latest
        paths: |-
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        token: ${{ github.token }}
      id: gradle-cache
    - name: Restore konan OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: restore
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'konan-release') }}
        key: ${{ format('konan-{0}-{1}-{2}', runner.arch, needs.prepare.outputs.kotlin_version, hashFiles('source/gradle/libs.versions.toml'))
          }}
        fallback-key: latest
        paths: ~/.konan
        token: ${{ github.token }}
      id: konan-cache
    - name: Compute SwiftPM cache key
      run: echo "key=xcode-26-6-${{ hashFiles('source/**/Package.resolved') }}" >> "$GITHUB_OUTPUT"
      working-directory: .
      id: spm-key
    - name: Restore swiftpm OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: restore
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'swiftpm-release') }}
        key: ${{ steps.spm-key.outputs.key }}
        fallback-key: latest
        paths: |-
          ~/Library/Caches/org.swift.swiftpm
          source/build/ci/release/ios/SourcePackages
        token: ${{ github.token }}
      id: spm-cache
    - name: Restore angle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: restore
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'angle') }}
        key: ${{ format('angle-{0}', needs.prepare.outputs.angle_revision) }}
        fallback-key: latest
        paths: source/shared/build/angle
        token: ${{ github.token }}
      id: angle-cache
    - name: Resolve pinned Swift packages
      run: python3 scripts/ci/ios_release.py --resolve-only
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      id: resolve
    - name: Publish swiftpm OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: publish
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'swiftpm-release') }}
        key: ${{ steps.spm-key.outputs.key }}
        fallback-key: latest
        paths: |-
          ~/Library/Caches/org.swift.swiftpm
          source/build/ci/release/ios/SourcePackages
        token: ${{ github.token }}
      continue-on-error: true
      if: ${{ steps.spm-cache.outputs.hit != 'true' }}
    - name: Install temporary Apple distribution signing
      uses: ./control/actions/apple-signing
      with:
        profiles: |-
          IOS_PROD_PROFILE_APP_BASE64
          IOS_PROD_PROFILE_SHARE_BASE64
          IOS_PROD_PROFILE_NSE_BASE64
          IOS_PROD_PROFILE_WIDGET_BASE64
        certificate-env: IOS_CERTIFICATE_BASE64
        certificate-password-env: IOS_CERTIFICATE_PASSWORD
    - name: Archive fully optimized production Release without Native release caches
      run: python3 scripts/ci/ios_release.py --skip-resolve
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      id: build
    - name: Upload Production dSYMs to Crashlytics
      run: |-
        test -x build/ci/release/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
        build/ci/release/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
          -gsp iosApp/iosApp/Config/Release/GoogleService-Info.plist -p ios "$DSYM_PATH"
      env:
        DSYM_PATH: ${{ steps.build.outputs.dsym_path }}
    - name: Retain IPA and zipped dSYMs
      uses: actions/upload-artifact@v7
      with:
        name: kmp-release-ios
        path: |-
          ${{ format('source/{0}', steps.build.outputs.ipa_path) }}
          ${{ format('source/{0}', steps.build.outputs.dsym_zip_path) }}
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Publish konan OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: publish
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'konan-release') }}
        key: ${{ format('konan-{0}-{1}-{2}', runner.arch, needs.prepare.outputs.kotlin_version, hashFiles('source/gradle/libs.versions.toml'))
          }}
        fallback-key: latest
        paths: ~/.konan
        token: ${{ github.token }}
      continue-on-error: true
      if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.konan-cache.outputs.hit != 'true' }}
    - name: Publish angle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: publish
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'angle') }}
        key: ${{ format('angle-{0}', needs.prepare.outputs.angle_revision) }}
        fallback-key: latest
        paths: source/shared/build/angle
        token: ${{ github.token }}
      continue-on-error: true
      if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.angle-cache.outputs.hit != 'true' }}
    - name: Publish gradle OCI bundle
      uses: ./control/actions/gh-bundle-cache
      with:
        mode: publish
        name: ${{ format('{0}-{1}-{2}-{3}', needs.prepare.outputs.name, runner.os, runner.arch, 'gradle') }}
        key: ${{ format('deps-{0}-{1}', runner.arch, hashFiles('source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties',
          'source/**/*.gradle.kts', 'source/gradle.properties')) }}
        fallback-key: latest
        paths: |-
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        token: ${{ github.token }}
      continue-on-error: true
      if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.gradle-cache.outputs.hit != 'true' }}
    - name: Remove temporary provisioning profiles
      uses: ./control/actions/apple-signing
      with:
        mode: cleanup
      if: ${{ always() }}
    - name: Retain ios diagnostics
      uses: actions/upload-artifact@v7
      with:
        name: ios-diagnostics
        path: |-
          source/build/ci/release/**/*.json
          source/build/ci/release/**/*.txt
          source/build/ci/release/**/*.log
        if-no-files-found: warn
        retention-days: 7
        overwrite: true
      if: ${{ always() }}
    if: ${{ needs.prepare.outputs.skip != 'true' }}
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
    - prepare
    - android
    - ios-build
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
    - name: Checkout trusted central controls
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: control
        persist-credentials: false
    - name: Mint source-scoped GitHub App token
      uses: actions/create-github-app-token@v3.3.0
      with:
        client-id: ${{ secrets.CI_APP_CLIENT_ID }}
        private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
        owner: ${{ needs.prepare.outputs.owner }}
        repositories: ${{ needs.prepare.outputs.name }}
      id: app-token
    - name: Checkout pinned source commit
      uses: actions/checkout@v7
      with:
        repository: ${{ needs.prepare.outputs.repo }}
        ref: ${{ needs.prepare.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: source
        persist-credentials: true
        fetch-depth: 0
    - name: Apply the prepared source-owned version pair
      run: python3 scripts/ci/release_version.py --apply --version "$VERSION" --build-number "$BUILD_NUMBER"
      env:
        VERSION: ${{ needs.prepare.outputs.version }}
        BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    - name: Download complete Android release artifacts
      uses: actions/download-artifact@v8
      with:
        name: kmp-release-android
        path: release-assets/android
    - name: Download IPA and dSYMs
      uses: actions/download-artifact@v8
      with:
        name: kmp-release-ios
        path: release-assets/ios
    - name: Download identical English release notes
      uses: actions/download-artifact@v8
      with:
        name: kmp-release-notes
        path: release-notes
    - name: Validate all six assets and notes before changing main or tags
      run: python3 ../control/scripts/kmp/release.py verify-assets --assets ../release-assets --notes ../release-notes/releasenotes.txt
    - name: Atomically commit bump and tag with a main source-SHA lease
      id: push
      run: python3 ../control/scripts/kmp/release.py push-version
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
    - name: Publish GitHub release only after all six assets have uploaded
      run: python3 ../control/scripts/kmp/release.py publish --repo "$SOURCE_REPO" --tag "$RELEASE_TAG" --assets ../release-assets --notes
        ../release-notes/releasenotes.txt
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        SOURCE_REPO: ${{ needs.prepare.outputs.repo }}
        RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
  notify:
    if: ${{ !cancelled() && needs.prepare.outputs.skip != 'true' }}
    needs:
    - prepare
    - android
    - ios-build
    - release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout trusted central controls
      uses: actions/checkout@v7
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.sha }}
        path: control
        persist-credentials: false
    - name: Notify release result with structured HTML and failure pointers
      uses: ./control/actions/telegram-notify
      with:
        token: ${{ secrets.SUBSCRIPTION_TELEGRAM_TOKEN }}
        chat-id: ${{ secrets.SUBSCRIPTION_TELEGRAM_TO }}
        kind: release
        status: ${{ needs.release.result == 'success' && 'success' || 'failure' }}
        repo: ${{ needs.prepare.outputs.repo }}
        branch: main
        title: ${{ format('{0} ({1})', needs.prepare.outputs.tag, needs.prepare.outputs.build_number) }}
        link: ${{ format('{0}/{1}/releases/tag/{2}', github.server_url, needs.prepare.outputs.repo, needs.prepare.outputs.tag) }}
        results: '${{ format(''prepare: {0}; Android: {1}; iOS: {2}; release: {3}'', needs.prepare.result, needs.android.result, needs[''ios-build''].result,
          needs.release.result) }}'
        run-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        github-token: ${{ github.token }}
