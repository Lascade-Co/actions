name: Daily Install to Paid

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition and fixed recipient
        type: choice
        options: [pt, ist]
        default: pt
      dry_run:
        description: Build the email without sending (required for IST tests)
        type: boolean
        default: false
      report_date:
        description: Report date (YYYY-MM-DD); blank = newest date past the edition's 05:00 cutoff
        default: ''
      recovery:
        description: Send the real email only if no Deliver step has succeeded for this edition and date
        type: boolean
        default: false
      force_resend:
        description: Explicitly send another copy even after an accepted send; does not count for dedupe
        type: boolean
        default: false
      schedule_in_min:
        description: PT test only, schedule 2 or more minutes from now; 0 uses normal timing
        type: number
        default: 0
      test_alert:
        description: Test only, fail the run on purpose to exercise the Telegram alert
        type: boolean
        default: false
  schedule:
    # The gates release at 05:05 local, after the 05:00 data cutoff.
    # PT keeps its original crons; IST's three waits all fit the two-job cap.
    - cron: '41 3 * * *'
    - cron: '41 6 * * *'
    - cron: '41 9 * * *'
    - cron: '7 13 * * *'
    - cron: '7 16 * * *'
    - cron: '7 19 * * *'

permissions:
  contents: read
  actions: read

# Concurrency is evaluated before scripts run. The minute distinguishes the two
# edition schedules; ip_editions validates the complete cron in the first step.
concurrency:
  group: daily-install-paid-${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '7 ') && 'ist' || 'pt') || inputs.edition || 'pt' }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  RAW: https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.sha }}
  EVENT: ${{ github.event_name }}
  SCHEDULE: ${{ github.event.schedule }}
  INPUT_EDITION: ${{ inputs.edition || 'pt' }}
  INPUT_DATE: ${{ inputs.report_date }}
  DRY_RUN: ${{ inputs.dry_run }}
  RECOVERY: ${{ inputs.recovery }}
  FORCE_RESEND: ${{ inputs.force_resend }}
  SCHEDULE_IN_MIN: ${{ inputs.schedule_in_min || 0 }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ github.event_name == 'schedule' && steps.gate.outputs.report_date || steps.settings.outputs.report_date }}
      edition: ${{ steps.settings.outputs.edition }}
      timezone: ${{ steps.settings.outputs.timezone }}
      sent_step: ${{ steps.settings.outputs.sent_step }}
    steps:
      - name: Resolve edition
        id: settings
        run: |
          for file in ip_editions.py ip_workflow.py; do
            curl -fsSL --retry 3 -o "$file" "$RAW/scripts/installpaid/$file"
          done
          curl -fsSL --retry 3 -o catchup_gate.py "$RAW/scripts/catchup/catchup_gate.py"
          python3 ip_workflow.py settings
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ZONE: ${{ steps.settings.outputs.timezone }}
          SENT_STEP: ${{ steps.settings.outputs.sent_step }}
        run: |
          python3 catchup_gate.py --phase 1 --event "$EVENT" --workflow daily-install-paid.yml \
            --sent-step "$SENT_STEP" --tz "$ZONE" --target 05:05

  gate2:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      report_date: ${{ steps.gate.outputs.report_date }}
      edition: ${{ needs.gate.outputs.edition }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ZONE: ${{ needs.gate.outputs.timezone }}
          SENT_STEP: ${{ needs.gate.outputs.sent_step }}
          REPORT_DATE: ${{ needs.gate.outputs.report_date }}
        run: |
          curl -fsSL --retry 3 -o catchup_gate.py "$RAW/scripts/catchup/catchup_gate.py"
          python3 catchup_gate.py --phase 2 --event "$EVENT" --workflow daily-install-paid.yml \
            --sent-step "$SENT_STEP" --tz "$ZONE" --target 05:05 --report-date "$REPORT_DATE"

  # Keep the job name: dated successful Deliver steps record Resend acceptance.
  email:
    needs: gate2
    if: needs.gate2.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      report_date: ${{ steps.dates.outputs.report_date }}
    concurrency:
      group: daily-install-paid-email-${{ needs.gate2.outputs.edition }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/installpaid
            scripts/catchup/catchup_gate.py
            data/installpaid_google_ipranges.json
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --quiet requests==2.34.2
      - name: Work out the report date
        id: dates
        env:
          REPORT_DATE: ${{ github.event_name == 'schedule' && needs.gate2.outputs.report_date || inputs.report_date }}
        run: python3 scripts/installpaid/ip_workflow.py settings
      - name: Check it has not gone out already
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.dates.outputs.report_date }}
        run: python3 scripts/installpaid/ip_workflow.py dedupe
      - name: Fail on purpose (alert test)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: |
          echo "test_alert is set: failing so the Telegram alert fires"
          exit 1
      - name: Build the email
        if: ${{ steps.dedupe.outputs.sent != 'True' }}
        working-directory: scripts/installpaid
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_QUERY_API_KEY }}
          INSTALLPAID_BENCHMARKS_JSON_B64: ${{ secrets.INSTALLPAID_BENCHMARKS_JSON_B64 }}
          REPORT_DATE: ${{ steps.dates.outputs.report_date }}
          EDITION: ${{ steps.dates.outputs.edition }}
        run: python3 ip_main.py --variant A --out out --edition "$EDITION" --report-date "$REPORT_DATE"
      # PT retains "Deliver for D". Tests and forced sends never count for dedupe.
      - name: ${{ steps.dates.outputs.send_step }}
        if: ${{ !inputs.dry_run && steps.dedupe.outputs.sent != 'True' }}
        working-directory: scripts/installpaid
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_DATE: ${{ steps.dates.outputs.report_date }}
          EDITION: ${{ steps.dates.outputs.edition }}
          MODE: ${{ steps.dates.outputs.mode }}
          OFFSET: ${{ steps.dates.outputs.schedule_in_min }}
          RUN_ID: ${{ github.run_id }}
          TEST_TAG: ${{ github.run_number }}
        run: |
          FLAGS=()
          if [ "$MODE" = real ] && [ "$EVENT" = workflow_dispatch ]; then FLAGS+=(--recovery); fi
          if [ "$MODE" = forced ]; then FLAGS+=(--force-resend); fi
          bash send_resend_ip.sh --edition "$EDITION" --report-date "$REPORT_DATE" --event "$EVENT" \
            --run-id "$RUN_ID" --schedule-in-min "$OFFSET" --test-tag "$TEST_TAG" "${FLAGS[@]}"

  # Separate job catches either gate, build or send failures. Delivery after a
  # successful Resend acceptance remains outside this workflow's monitoring.
  notify:
    needs: [gate, gate2, email]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alert on Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.INSTALLPAID_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.INSTALLPAID_TELEGRAM_CHAT }}
          REPORT_DATE: ${{ needs.email.outputs.report_date || needs.gate2.outputs.report_date || needs.gate.outputs.report_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily-install-paid.yml
        run: |
          for file in ip_editions.py ip_workflow.py; do curl -fsSL --retry 3 -o "$file" "$RAW/scripts/installpaid/$file"; done
          curl -fsSL --retry 3 -o catchup_gate.py "$RAW/scripts/catchup/catchup_gate.py"
          NOW=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq .run_started_at 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
          export NOW
          MESSAGE=$(python3 ip_workflow.py failure-message)
          curl -fsS --max-time 30 -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode chat_id="$CHAT" --data-urlencode text="$MESSAGE"
          echo "alert sent"
