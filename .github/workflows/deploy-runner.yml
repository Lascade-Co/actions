# Required Parameters
# repo, pr, project_slug, env_slug, branch, comment_body

name: "Branch Deploy"
run-name: "${{ github.event.client_payload.repo }} · ${{ github.event.client_payload.branch || format('PR #{0}', github.event.client_payload.pr) }}"

on:
  repository_dispatch:
    types: [deploy-pr]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys reach the droplet over SSH through Cloudflare Tunnel with an Access service token.
    # Each environment's token lives in a GitHub environment, so only this job can read it, and
    # only prod deploys get the prod token.
    environment: ${{ github.event.client_payload.env_slug == 'prod' && 'cloudflare-prod' || 'cloudflare-staging' }}
    env:
      # cloudflared reads these; they never appear on a command line.
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ github.event.client_payload.repo }}"   # e.g. Lascade-Co/travel-animator-android
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"     # Lascade-Co
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"     # travel-animator-android

      # Mint a GitHub App token scoped to that one repo
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}

      - name: Purge previous comments from this workflow
        if: ${{ github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const [owner, repo] = "${{ github.event.client_payload.repo }}".split("/");
            const issue_number = Number("${{ github.event.client_payload.pr }}");
            const markers = [ 
              "<!-- deploy-pr-${{ github.event.client_payload.env_slug }} -->",
              "### Deployment"
            ];
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            let deleted = 0;
            for (const c of comments) {
              if (markers.find((m) => (c.body || "").includes(m))) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
                deleted++;
              }
            }
            core.info(`Deleted ${deleted} prior deploy-pr comments`);

      - name: Comment on PR About Action Status
        uses: peter-evans/create-or-update-comment@v5
        id: status
        with:
          edit-mode: "replace"
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          body: |
            <!-- deploy-pr-${{ github.event.client_payload.env_slug }} -->
            🏗️ Deploy started.
            Watch progress [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/private.key
          chmod 600 ~/.ssh/private.key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DIGITAL_OCEAN_SSH_KEY }}

      - name: Import env secrets from Infisical
        uses: Infisical/secrets-action@v1.0.15
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ github.event.client_payload.project_slug }}
          env-slug: ${{ github.event.client_payload.env_slug }}
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          export-type: file
          file-output-path: /.env

      - name: Extract Env
        id: extract
        run: |
          if [ -z "${TUNNEL_SERVICE_TOKEN_ID:-}" ] || [ -z "${TUNNEL_SERVICE_TOKEN_SECRET:-}" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are not set in the '${{ github.event.client_payload.env_slug == 'prod' && 'cloudflare-prod' || 'cloudflare-staging' }}' environment of this repo"
            exit 1
          fi
          source .env
          # The infra-sync Worker publishes every droplet (named after its HOST) at
          # ssh-<labels, dots as dashes>.<zone>, e.g. staging.esim.lascade.com ->
          # ssh-staging-esim.lascade.com. Our zones are all two labels (lascade.com, ...).
          zone=$(awk -F. '{print $(NF-1)"."$NF}' <<<"$HOST")
          label="${HOST%."$zone"}"
          if [ -z "$label" ] || [ "$label" = "$HOST" ]; then
            echo "::error::HOST '$HOST' has no label under a zone"; exit 1
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "ssh_host=ssh-${label//./-}.$zone" >> "$GITHUB_OUTPUT"
          echo "Deploying to $HOST through ssh-${label//./-}.$zone"

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        env:
          HOST: ${{ steps.extract.outputs.host }}
          SSH_HOST: ${{ steps.extract.outputs.ssh_host }}
        run: |
          # The tunnel route ends at the droplet's own sshd, so this is the droplet's host key,
          # stored under its name (first use on a fresh runner, as ssh-keyscan did before).
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOST
            HostKeyAlias $HOST
            User ubuntu
            IdentityFile ~/.ssh/private.key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Create SSH Script
        run: |
          echo 'ssh deploy-target "$@"' > s.sh
          chmod +x s.sh

      - name: Copy .env to droplet project folder
        run: scp .env "deploy-target:$PROJECT_FOLDER/.env"
        env:
          PROJECT_FOLDER: ${{ steps.repo.outputs.name }}

      - name: Deploy
        run: ./s.sh "deploy ${{ github.event.client_payload.branch }}"

      - name: Decide restart targets
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          body="${{ github.event.client_payload.comment_body }}"
          if echo "$body" | grep -qi '\bserver\b'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$body" | grep -qi '\bcelery\b'; then
            echo "celery=true" >> "$GITHUB_OUTPUT"
          else
            echo "celery=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$body" | grep -Eqi '\b(collectstatic|static)\b'; then
            echo "collectstatic=true" >> "$GITHUB_OUTPUT"
          else
            echo "collectstatic=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve server task option
        id: server-task
        shell: bash
        run: |
          set -euo pipefail

          probe_output="$(timeout 10s ./s.sh "shell server" </dev/null 2>&1 || true)"
          echo "$probe_output"

          if ! printf '%s\n' "$probe_output" | grep -qi "Multiple tasks found for service"; then
            echo "No interactive task selection prompt detected; using direct server commands."
            echo "interactive=false" >> "$GITHUB_OUTPUT"
            echo "option=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          option="$(
            printf '%s\n' "$probe_output" | awk '
              match($0, /^[[:space:]]*([0-9]+)\)/, m) {
                idx = m[1]
                if (match($0, /Node:[[:space:]]*([^)]*)/, n)) {
                  node = n[1]
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", node)
                  if (length(node) > 0) {
                    print idx
                    exit
                  }
                }
              }
            '
          )"

          if [ -z "${option:-}" ]; then
            option=1
            echo "Could not detect non-empty Node option. Defaulting to option ${option}."
          else
            echo "Selected server task option ${option} (non-empty Node)."
          fi

          echo "interactive=true" >> "$GITHUB_OUTPUT"
          echo "option=${option}" >> "$GITHUB_OUTPUT"

      - name: Run Collectstatic in Docker Container (interactive server selection)
        if: ${{ steps.decide.outputs.collectstatic == 'true' && steps.server-task.outputs.interactive == 'true' }}
        run: printf '%s\n' "${{ steps.server-task.outputs.option }}" | ./s.sh "shell server run python manage.py collectstatic --no-input"

      - name: Run Collectstatic in Docker Container
        if: ${{ steps.decide.outputs.collectstatic == 'true' && steps.server-task.outputs.interactive != 'true' }}
        run: ./s.sh "shell server run python manage.py collectstatic --no-input"

      - name: Run Migrations in Docker Container (interactive server selection)
        if: ${{ steps.server-task.outputs.interactive == 'true' }}
        run: printf '%s\n' "${{ steps.server-task.outputs.option }}" | ./s.sh "shell server run python manage.py migrate"

      - name: Run Migrations in Docker Container
        if: ${{ steps.server-task.outputs.interactive != 'true' }}
        run: ./s.sh "shell server run python manage.py migrate"

      - name: Restart server
        if: ${{ steps.decide.outputs.server == 'true' }}
        run: ./s.sh "shell server restart"

      - name: Restart celery (with beat/worker fallback)
        if: ${{ steps.decide.outputs.celery == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ./s.sh "shell celery restart"; then
            echo "Celery restarted successfully."
            exit 0
          fi

          echo "Celery restart failed. Falling back to beat and worker restarts..."
          ./s.sh "shell beat restart"
          ./s.sh "shell worker restart"
          echo "Fallback beat and worker restarts succeeded."

      - name: Wait for server healthcheck
        run: |
          url="https://$HOST/healthcheck/"
          deadline=$((SECONDS + 60))
          curl_opts=(--silent --connect-timeout 5 --max-time 15)

          # 1. The public URL, the way users reach the site.
          read -r code redirect < <(curl "${curl_opts[@]}" --output /dev/null --write-out '%{http_code} %{redirect_url}\n' "$url" || echo "000")
          # A site behind Cloudflare Access answers with a redirect to the login page, which
          # `curl --fail` would count as healthy. Treat that as a failure instead.
          if [[ "${redirect:-}" == *".cloudflareaccess.com/"* ]]; then
            echo "::error::$url redirects to the Cloudflare Access login. The infra-sync Worker adds a /healthcheck bypass for droplets tagged ci-deploy; check the droplet's tags."
            exit 1
          fi
          if [ "$code" != "000" ]; then
            until curl "${curl_opts[@]}" --fail --output /dev/null "$url"; do
              if [ $SECONDS -ge $deadline ]; then echo "::error::$url did not become healthy within 60s"; exit 1; fi
              echo "Waiting for healthcheck..."
              sleep 3
            done
            echo "Server is healthy ($url)."
            exit 0
          fi

          # 2. Not reachable from this runner (the site's firewall only allows the office/VPN and
          #    Cloudflare): check it from the droplet itself, over the same SSH tunnel as the deploy.
          echo "$url is not reachable from the runner; checking it on the droplet"
          remote="c=\$(curl -sk -o /dev/null --max-time 15 -w '%{http_code}' --resolve '$HOST:443:127.0.0.1' 'https://$HOST/healthcheck/'); echo \"\$c\" | grep -q '^2' && exit 0; c2=\$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' -H 'Host: $HOST' 'http://127.0.0.1/healthcheck/'); echo \"\$c2\" | grep -q '^2' && exit 0; echo \"on-droplet healthcheck: https=\$c http=\$c2\"; exit 1"
          until ./s.sh "$remote"; do
            if [ $SECONDS -ge $deadline ]; then echo "::error::$HOST did not become healthy on the droplet within 60s"; exit 1; fi
            echo "Waiting for healthcheck..."
            sleep 3
          done
          echo "Server is healthy (checked on the droplet)."
        env:
          HOST: ${{ steps.extract.outputs.host }}

      - name: Comment on PR With Success Status
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          comment-id: ${{ steps.status.outputs.comment-id }}
          edit-mode: "replace"
          body: |
            <!-- deploy-pr-${{ github.event.client_payload.env_slug }} -->
            ✅ Branch Deployed to ${{ github.event.client_payload.env_slug }}

      # ---------- Failure comment ----------
      - name: Comment on PR if build failed
        if: ${{ failure() && github.event.client_payload.pr && github.event.client_payload.pr != '' && github.event.client_payload.pr != 'null' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.status.outputs.comment-id }}
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.event.client_payload.repo }}
          issue-number: ${{ github.event.client_payload.pr }}
          edit-mode: "replace"
          body: |
            <!-- deploy-pr-${{ github.event.client_payload.env_slug }} -->
            ❌ Deploy failed for ${{ github.event.client_payload.env_slug }}
            [Check logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
