name: TADA platform wheels

# The four platform wheels, defined ONCE and called by every path that publishes them:
# publish-tada-wheel.yml (GHCR bundle for TARS) and publish-tacli-pypi.yml (PyPI).
#
# It is reusable for one reason above the others: the ANGLE pins below. A revision bump must
# move these constants, `travel-animator-shared`'s `angleRevision`/`angleSha256` (iOS) and the
# PROVENANCE documents in ONE change -- two ANGLE revisions means two shader translators and
# two rasterisations of the same frame (risk R14). Duplicating this matrix per publishing path
# would put the digests in two files and make that skew a matter of remembering.
#
# The caller owns `ta-render.jar`: it must upload it as the `ta-render-jar` artifact before
# calling this, because a reusable workflow shares the caller's run and therefore its artifacts.
# That keeps Gradle's three-build composite on ONE runner instead of four.

on:
  workflow_call:
    inputs:
      repo:
        description: owner/name of the TADA repository to build from
        required: true
        type: string
      sha:
        description: Full 40-character TADA commit SHA
        required: true
        type: string

permissions:
  contents: read

# ANGLE is CONSUMED here by digest, never built here. The digest is what makes the bytes in a
# published wheel the bytes that were verified by hand; a per-build compile would replace that
# guarantee with a hope.
env:
  ANGLE_REVISION: be80ce591a481c12d60c50d6040d40c035b40a2b
  ANGLE_RELEASE_REPO: Lascade-Co/travel-animator-shared
  ANGLE_RELEASE_TAG: angle-be80ce59
  # Built on an M2, 2026-08-11; bit-identical 695-frame render to the previous reference.
  # See travel-animator-shared third_party/angle/PROVENANCE-macos.md.
  ANGLE_SHA256_MACOS: dfe3d633b280bf2479189716ad3ab14381260180bd5c5246c3d80913eb477e30
  # Do NOT replace this with Skiko's `skiko-awt-runtime-angle-windows-x64`: that is ANGLE
  # 2.1.25511 against our 2.1.28587, precisely the skew this pin exists to prevent. The digest
  # is of the REPACKED asset -- the Windows build wrote backslash zip separators, which extract
  # as flat `include\EGL\egl.h` files on POSIX. See scripts/angle/PROVENANCE-windows.md.
  ANGLE_SHA256_WINDOWS_X64: 8a2732e41e0e14471fe7f852c6ee13a1ace13ed2178231c8d16353e1b35a59cc

jobs:
  # One leg per platform, because jlink runs on the target, macOS needs `codesign`, and a
  # platform wheel installs only where its tag matches. The macOS and Windows ANGLE are our
  # own BSD-3-Clause builds of the pinned revision, which is what makes them redistributable
  # in a PyPI wheel at all. A runner label that does not resolve -- `ubuntu-24.04-arm` being
  # the one to watch -- fails its leg at scheduling rather than silently going missing.
  wheel:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            tag: manylinux_2_28_x86_64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            # NOT 2_28: LWJGL 3.3.6's aarch64 liblwjgl.so references GLIBC_2.34, so the whole
            # wheel is capped there. Measured 2026-08-11; auditwheel refuses 2_28 outright.
            tag: manylinux_2_34_aarch64
          # `angle_platform` is the release asset's suffix; its ABSENCE is what marks a leg as
          # needing no ANGLE. Linux renders on the system EGL/GLES, and a bundled payload there
          # would take the GPU worker off the NVIDIA driver.
          - platform: macos-arm64
            runner: macos-14
            container: ""
            tag: macosx_11_0_arm64
            angle_platform: macos
          - platform: windows-x64
            runner: windows-latest
            container: ""
            tag: win_amd64
            angle_platform: windows-x64
    steps:
      - name: Extract owner/repo
        id: repo
        shell: bash
        run: |
          FULL="${{ inputs.repo }}"
          echo "owner=${FULL%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${FULL#*/}"   >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App token (tada + shared)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: |
            ${{ steps.repo.outputs.name }}
            travel-animator-shared

      - name: Check out TADA @ requested commit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read pinned shared revision
        id: shared
        shell: bash
        run: echo "revision=$(git rev-parse HEAD:shared)" >> "$GITHUB_OUTPUT"

      - name: Check out private shared protos
        uses: actions/checkout@v6
        with:
          repository: Lascade-Co/travel-animator-shared
          ref: ${{ steps.shared.outputs.revision }}
          path: shared
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.8.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --all-packages --all-extras

      - name: Generate protobuf modules
        run: uv run --locked --all-packages --all-extras python tada_render/hatch_build.py

      # The PURE public wheel each leg folds its own payload into. Built per leg so `uv build`
      # runs on the same checkout that generated the protos; identical across legs by construction.
      - name: Build the pure wheels
        run: uv build --wheel --all-packages --out-dir pure

      - name: Download ta-render.jar
        uses: actions/download-artifact@v8
        with:
          name: ta-render-jar
          path: jar

      - name: Fetch the packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-scripts
          base=https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/tada-wheel
          for name in build_jvm_payload.py inject_wheel_payload.py check_glibc_floor.py \
                      assert_wheel_exec_bit.py build_linux_wheel.sh; do
            curl -sSfL "$base/$name" -o "ci-scripts/$name"
          done

      # `docker run` rather than a job-level `container:`: only the payload assembly and its
      # glibc measurement need manylinux_2_28, and putting the whole job in AlmaLinux 8 would
      # drag checkout, setup-uv, setup-java and every upload through it for no benefit.
      - name: Build the platform wheel (Linux, in manylinux)
        if: ${{ matrix.container != '' }}
        env:
          CONTAINER: ${{ matrix.container }}
          IO_PLATFORM: ${{ matrix.platform }}
          MANYLINUX_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/io" -w /io \
            -e IO_WHEEL="/io/$(ls pure/travel_animator-*.whl)" \
            -e IO_JAR=/io/jar/ta-render.jar \
            -e IO_OUT=/io/platform \
            -e IO_PLATFORM="$IO_PLATFORM" \
            -e MANYLINUX_TAG="$MANYLINUX_TAG" \
            "$CONTAINER" bash /io/ci-scripts/build_linux_wheel.sh

      - name: Set up JDK for jlink
        if: ${{ matrix.container == '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # One pinned revision, one release, one asset per platform, each pinned by SHA-256 --
      # the same arrangement shared's `downloadAngle` task uses for iOS, for the same reason:
      # the digest is what makes the binaries in a published wheel the binaries that were
      # verified by hand. A mismatch FAILS the job; it is never a warning.
      #
      # `travel-animator-shared` is private, so this needs the App token minted above and the
      # REST asset endpoint with `Accept: application/octet-stream` (the browser-facing
      # releases/download URL 404s unauthenticated). fetch_pinned_angle.py does both.
      - name: Fetch and verify the pinned ANGLE
        if: ${{ matrix.angle_platform != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANGLE_PLATFORM: ${{ matrix.angle_platform }}
        run: |
          set -euo pipefail

          # The tag is the revision's first 8 characters. Asserted, not assumed: a half-edited
          # pin would otherwise download a DIFFERENT revision that still passes its checksum.
          if [[ "$ANGLE_RELEASE_TAG" != "angle-${ANGLE_REVISION:0:8}" ]]; then
            echo "::error::ANGLE_RELEASE_TAG '$ANGLE_RELEASE_TAG' does not match ANGLE_REVISION" \
                 "'$ANGLE_REVISION' (expected angle-${ANGLE_REVISION:0:8}). The pin is half-edited."
            exit 1
          fi

          case "$ANGLE_PLATFORM" in
            macos)       sha256="$ANGLE_SHA256_MACOS" ;;
            windows-x64) sha256="$ANGLE_SHA256_WINDOWS_X64" ;;
            *) echo "::error::no pinned ANGLE checksum is wired for '$ANGLE_PLATFORM'"; exit 1 ;;
          esac

          # Dormant while every wired platform carries a digest. This is what a platform whose
          # ANGLE asset has not been built and published yet would fail with -- loudly, and
          # naming the one-time procedure, rather than falling back to a different ANGLE.
          if [[ -z "$sha256" ]]; then
            echo "::error::ANGLE for $ANGLE_PLATFORM has not been built and published yet - see scripts/angle/PROVENANCE-windows.md"
            cat >&2 <<EOF

          ================================================================================
          No ANGLE asset is published for $ANGLE_PLATFORM at revision $ANGLE_REVISION.

          CI does not build ANGLE. It consumes a prebuilt, pinned, checksummed release asset,
          and there is no such asset for this platform, so this wheel cannot be built.

          To unblock, ONCE:
            1. On a Windows box with Visual Studio 2022 + the Windows SDK, run
               scripts/angle/build_angle_windows.ps1 -Revision $ANGLE_REVISION -TargetCpu x64
               following scripts/angle/PROVENANCE-windows.md.
            2. Verify it (that document's checklist), then
               gh release upload $ANGLE_RELEASE_TAG ${ANGLE_RELEASE_TAG}-${ANGLE_PLATFORM}.zip \\
                 --repo $ANGLE_RELEASE_REPO
            3. Set ANGLE_SHA256_WINDOWS_X64 in _tada-wheels.yml to the published digest.

          Do NOT substitute Skiko's skiko-awt-runtime-angle-windows-x64. It is ANGLE 2.1.25511
          against the 2.1.28587 every other platform of this project renders through: a second
          shader translator, a second rasterisation of the same frame (risk R14). Failing here
          is the intended behaviour until the asset above exists.
          ================================================================================
          EOF
            exit 1
          fi

          mkdir -p ci-scripts
          curl -sSfL https://raw.githubusercontent.com/Lascade-Co/actions/main/scripts/angle/fetch_pinned_angle.py \
            -o ci-scripts/fetch_pinned_angle.py
          python ci-scripts/fetch_pinned_angle.py \
            --repo "$ANGLE_RELEASE_REPO" \
            --tag "$ANGLE_RELEASE_TAG" \
            --asset "${ANGLE_RELEASE_TAG}-${ANGLE_PLATFORM}.zip" \
            --sha256 "$sha256" \
            --out angle

      - name: Build the platform wheel (native runner)
        if: ${{ matrix.container == '' }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          skiko_version=0.148.2
          # Skiko names its runtime artifacts with the same os-arch spelling we use.
          curl -sSfL --retry 5 --retry-delay 3 -o skiko.jar \
            "https://repo1.maven.org/maven2/org/jetbrains/skiko/skiko-awt-runtime-${PLATFORM}/${skiko_version}/skiko-awt-runtime-${PLATFORM}-${skiko_version}.jar"
          python ci-scripts/build_jvm_payload.py \
            --platform "$PLATFORM" \
            --jar jar/ta-render.jar \
            --skiko-jar skiko.jar \
            --angle-dir angle \
            --platform-tag "$TAG" \
            --out payload
          python ci-scripts/inject_wheel_payload.py \
            --wheel "$(ls pure/travel_animator-*.whl)" \
            --payload payload \
            --tag "py3-none-${TAG}" \
            --out-dir platform
          python ci-scripts/assert_wheel_exec_bit.py "$(ls platform/*.whl)"
          cp payload/PAYLOAD.json "platform/PAYLOAD-${PLATFORM}.json"

      # ---------------------------------------------------------------------------------
      # The smoke: install the finished wheel and make it render a GL probe through its OWN
      # payload. This is the step that would have caught the pip/uv execute-bit divergence
      # (pip additionally requires the regular-file type bits in the zip's external_attr;
      # uv does not), and it is the only check that exercises the launcher, the JRE, the
      # LWJGL shims, Skiko and the GL driver together.
      #
      # On Linux it runs on the HOST runner, not in manylinux: the host is where a real GL
      # stack can be apt-installed, and a manylinux_2_28 wheel installs happily on glibc 2.39.
      # ---------------------------------------------------------------------------------
      - name: Install the GL runtime for the smoke (Linux)
        if: ${{ matrix.container != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri libfontconfig1

      - name: Smoke the packaged renderer
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          uv venv --python 3.12 .smoke
          uv pip install --python .smoke --no-deps "$(ls platform/*.whl)" numpy
          uv run --python .smoke --no-project python - <<'PY'
          import subprocess, sys
          from tada_render import render_bridge

          command = render_bridge.packaged_runtime()
          if command is None:
              sys.exit("the installed wheel carries no JVM payload")
          print("launcher:", " ".join(command))
          env = render_bridge.child_environment()
          print("TADA_ANGLE_DIR:", env.get(render_bridge.ANGLE_DIR_ENV, "(none: system GLES)"))
          # exit 70 is the protocol's `gl_unavailable`; anything else is a launcher or
          # packaging failure and must not be reported as a driver problem.
          result = subprocess.run(command + ["self-test"], env=env,
                                  capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr, file=sys.stderr)
          if result.returncode == 137 or result.returncode == -9:
              sys.exit("SIGKILL with no stderr -- on macOS this is a TAMPERED CODE SIGNATURE, "
                       "not a GL failure. Re-sign after any lipo/strip/install_name_tool.")
          if result.returncode != 0:
              sys.exit(f"self-test exited {result.returncode}")
          PY

      - name: Upload the platform wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: platform/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
