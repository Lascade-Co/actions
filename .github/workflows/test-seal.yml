name: Test sealing

on:
  push:
    paths:
      - "scripts/seal/**"
      - "viewer/**"
      - ".github/workflows/**"
      - "actions/**"
  pull_request:
    paths:
      - "scripts/seal/**"
      - "viewer/**"
      - ".github/workflows/**"
      - "actions/**"

permissions:
  contents: read

defaults:
  run:
    shell: "seal-bash {0}"

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Seal job output
        shell: bash
        run: |
          u="https://raw.githubusercontent.com/Lascade-Co/actions/${{ github.workflow_sha }}/scripts/seal/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 60 -o "$RUNNER_TEMP/seal-install.tmp" "$u"
          test -s "$RUNNER_TEMP/seal-install.tmp" && mv "$RUNNER_TEMP/seal-install.tmp" "$RUNNER_TEMP/seal-install.sh"
          SEAL_REF="${{ github.workflow_sha }}" bash "$RUNNER_TEMP/seal-install.sh"
      - uses: actions/checkout@v7
      - name: Run seal and workflow policy tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pytest==9.1.1 pyyaml
          "$RUNNER_TEMP/venv/bin/python" -m pytest scripts/seal/ -q
      - name: Run viewer unit tests
        if: runner.os == 'Linux'
        run: node --test viewer/lib/*.test.mjs
      - name: Upload sealed log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SEAL_LOG_ARTIFACT }}
          path: ${{ runner.temp }}/seal/out/
          retention-days: 7
          if-no-files-found: ignore
