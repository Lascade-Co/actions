name: Install to Paid Watchdog

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to check
        type: choice
        options: [pt, ist]
        default: pt
      phase:
        description: Warning phase to check (local time guard still applies)
        type: choice
        options: [prep, deliver]
        default: deliver
  schedule:
    # The script guards each edition's local window, including PT's DST season.
    - cron: '30 12,13 * * *'
    - cron: '15 13-19 * * *'
    - cron: '0 0 * * *'
    - cron: '45 0-5 * * *'

permissions:
  contents: read
  actions: read

# Serialize history checks so two late crons cannot alert simultaneously.
concurrency:
  group: install-paid-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/catchup/catchup_gate.py
            scripts/installpaid/ip_watchdog.py
            scripts/installpaid/ip_editions.py
          sparse-checkout-cone-mode: false

      - name: Resolve edition and phase
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_EDITION: ${{ inputs.edition || 'pt' }}
          INPUT_PHASE: ${{ inputs.phase || 'deliver' }}
        run: |
          PYTHONPATH=scripts/installpaid:scripts/catchup python3 - <<'PY'
          import os
          from catchup_gate import emit
          from ip_editions import get_edition, resolve_watchdog_schedule
          edition, phase = (resolve_watchdog_schedule(os.environ['SCHEDULE']) if os.environ['EVENT_NAME'] == 'schedule'
                            else (os.environ['INPUT_EDITION'], os.environ['INPUT_PHASE']))
          get_edition(edition)
          if phase not in ('prep', 'deliver'):
              raise ValueError('invalid watchdog phase')
          emit(edition=edition, phase=phase)
          PY

      - name: Check edition acceptance
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ steps.edition.outputs.edition }}
          PHASE: ${{ steps.edition.outputs.phase }}
        run: PYTHONPATH=scripts/catchup python3 scripts/installpaid/ip_watchdog.py --edition "$EDITION" --phase "$PHASE"

      # The successful dated step is the acceptance marker for this warning phase.
      - name: ${{ steps.check.outputs.alert_step }}
        if: steps.check.outputs.alert == 'true'
        env:
          TOKEN: ${{ secrets.INSTALLPAID_TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.INSTALLPAID_TELEGRAM_CHAT }}
          MESSAGE: ${{ steps.check.outputs.message }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/daily-install-paid.yml
        run: |
          curl -fsS --max-time 30 -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="$MESSAGE. $URL"
          echo "alert sent"
