name: callee
on:
  workflow_call:
defaults:
  run:
    shell: "seal-bash-e {0}"
jobs:
  inner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Seal job output
        uses: Lascade-Co/actions/actions/seal@seal-v1
      - run: echo "${{ secrets.FOO }}"
      - if: always()
        uses: Lascade-Co/actions/actions/seal-upload@seal-v1
