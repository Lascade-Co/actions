# Copy into the Kotlin Toolchain (Amper) app repository only after the central workflow is live.
# Replace YOUR_INFISICAL_PROJECT with the Infisical project slug (e.g. treasurehunch).
# The repo also needs .ci/amper.json, the CENTRAL_DISPATCH_TOKEN secret and an entry in config/apps.json here;
# see docs/amper-ci.md.
name: Central Amper Debug CI
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch to build
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: amper-debug-trigger-${{ github.repository }}-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Never check out PR code in this privileged trigger.
      - name: Dispatch Android debug APK and iOS staging TestFlight builds
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
          repository: Lascade-Co/actions
          event-type: amper-debug
          client-payload: >-
            {"repo":${{ toJSON(github.repository) }},
             "pr":${{ toJSON(github.event.pull_request.number || '') }},
             "branch":${{ toJSON(github.event.pull_request.head.ref || inputs.branch) }},
             "title":${{ toJSON(github.event.pull_request.title || format('Manual build: {0}', inputs.branch)) }},
             "project_slug":"YOUR_INFISICAL_PROJECT"}
