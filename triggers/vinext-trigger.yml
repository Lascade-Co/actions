# Copy into the application's .github/workflows/deploy.yml after registering the
# project in actions/data/vinext-projects.json and configuring CENTRAL_DISPATCH_TOKEN.
name: Deploy Vinext

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  deploy:
    uses: Lascade-Co/actions/.github/workflows/vinext-deploy-trigger.yml@main
    with:
      project_slug: your-infisical-project-slug
    secrets:
      central_dispatch_token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
