# Copy into the Kotlin Toolchain (Amper) app repository as .github/workflows/release.yml, only after the central
# workflow is live. Replace YOUR_INFISICAL_PROJECT with the Infisical project slug registered for the repo in
# config/apps.json (e.g. treasurehunch). Every push to main dispatches a signed store release; label the merged PR
# minor or major to bump that part instead of the patch. See docs/amper-ci.md.
name: Request central Amper release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amper-release-trigger-${{ github.repository }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # No source checkout or private inputs in this trigger.
      - name: Pin main and skip the release bump commit
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const ref = context.eventName === 'push' ? context.sha : 'main';
            const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref});
            const subject = commit.commit.message.split('\n', 1)[0];
            const bump = subject.startsWith('chore(release): v');
            core.setOutput('skip', String(bump));
            core.setOutput('sha', commit.sha);
      - name: Dispatch production Android and iOS builds
        if: steps.source.outputs.skip != 'true'
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.CENTRAL_DISPATCH_TOKEN }}
          repository: Lascade-Co/actions
          event-type: amper-release
          client-payload: >-
            {"repo":${{ toJSON(github.repository) }},
             "branch":"main",
             "sha":${{ toJSON(steps.source.outputs.sha) }},
             "project_slug":"YOUR_INFISICAL_PROJECT"}
