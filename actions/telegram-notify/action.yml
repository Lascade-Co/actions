name: Telegram notification
description: >-
  Send one build notification from Linux or macOS; fail visibly on transport or Telegram errors.
  Structured inputs (kind/status) send escaped HTML with the run link and a failing job/step/error
  pointer only on failure; a bare message sends plain text. Store publishers whose store the dispatch
  did not select send status skipped with the opt-out reason.
inputs:
  token:
    description: Telegram bot token.
    required: true
  chat-id:
    description: Destination chat ID.
    required: true
  message:
    description: Plain-text message (legacy mode, used only when kind is empty).
    required: false
    default: ''
  kind:
    description: android, testflight, release, playstore, appstore or appstore-prepared (App Store version prepared, not submitted).
    required: false
    default: ''
  status:
    description: >-
      success, failure, withheld (lint auto-fix pushed) or skipped (kind appstore or playstore only:
      the dispatch did not select this store; no failure lookup).
    required: false
    default: ''
  repo:
    description: Source repository (owner/name).
    required: false
    default: ''
  branch:
    description: Source branch.
    required: false
    default: ''
  title:
    description: PR or manual build title.
    required: false
    default: ''
  pr-url:
    description: PR URL; the title links to it when present.
    required: false
    default: ''
  pr-number:
    description: >-
      Source PR number for status skipped; the reason line names its no-ios/no-android label and links
      the PR in repo. Empty means the store was not selected without a PR.
    required: false
    default: ''
  link:
    description: Artifact or release link shown on success and on a skipped store publish.
    required: false
    default: ''
  build-number:
    description: TestFlight build number.
    required: false
    default: ''
  results:
    description: One-line job results shown on failure.
    required: false
    default: ''
  run-url:
    description: Workflow run URL, shown only on failure.
    required: false
    default: ''
  github-token:
    description: Token with actions:read and checks:read, used only on failure to point at the failing job, step and error.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Send notification
      shell: bash
      env:
        TELEGRAM_TOKEN: ${{ inputs.token }}
        TELEGRAM_CHAT: ${{ inputs.chat-id }}
        TELEGRAM_MESSAGE: ${{ inputs.message }}
        TELEGRAM_KIND: ${{ inputs.kind }}
        TELEGRAM_STATUS: ${{ inputs.status }}
        TELEGRAM_REPO: ${{ inputs.repo }}
        TELEGRAM_BRANCH: ${{ inputs.branch }}
        TELEGRAM_TITLE: ${{ inputs.title }}
        TELEGRAM_PR_URL: ${{ inputs.pr-url }}
        TELEGRAM_PR_NUMBER: ${{ inputs.pr-number }}
        TELEGRAM_LINK: ${{ inputs.link }}
        TELEGRAM_BUILD_NUMBER: ${{ inputs.build-number }}
        TELEGRAM_RESULTS: ${{ inputs.results }}
        TELEGRAM_RUN_URL: ${{ inputs.run-url }}
        TELEGRAM_GITHUB_TOKEN: ${{ inputs.github-token }}
        CONTROL_SHA: ${{ github.sha }}
      run: |
        script=$(mktemp "$RUNNER_TEMP/telegram-notify.XXXXXX")
        trap 'rm -f "$script" "$script.tmp"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 -o "$script.tmp" "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/scripts/kmp/telegram_notify.py"
        test -s "$script.tmp"
        mv "$script.tmp" "$script"
        python3 "$script"
