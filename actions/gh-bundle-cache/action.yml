name: GitHub OCI dependency bundle cache
description: Restore or publish selected dependency paths through GHCR, outside the Actions cache quota.
inputs:
  mode:
    description: restore or publish
    required: true
  name:
    description: Cache namespace normalized to lowercase; include source repository, OS and architecture.
    required: true
  key:
    description: Exact dependency-content tag.
    required: true
  fallback-key:
    description: Optional moving fallback tag, normally latest.
    default: latest
  paths:
    description: Newline-separated dependency paths; tilde and environment variables expand.
    required: true
  token:
    description: Token with packages read/write permission.
    default: ${{ github.token }}
outputs:
  hit:
    description: True only for an exact-key restore.
    value: ${{ steps.bundle.outputs.hit }}
  bytes:
    description: Restored or published uncompressed archive bytes.
    value: ${{ steps.bundle.outputs.bytes }}
  restored-key:
    description: Exact tag restored, or empty on a cold miss.
    value: ${{ steps.bundle.outputs.restored-key }}
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2
      continue-on-error: true
      with:
        version: 1.3.5
    - name: Restore or publish bundle
      id: bundle
      continue-on-error: true
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.mode }}
        CACHE_NAME: ${{ inputs.name }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_FALLBACK_KEY: ${{ inputs.fallback-key }}
        CACHE_PATHS: ${{ inputs.paths }}
        GH_TOKEN: ${{ inputs.token }}
        CONTROL_SHA: ${{ github.sha }}
      run: |
        script=$(mktemp "$RUNNER_TEMP/bundle-cache.XXXXXX")
        trap 'rm -f "$script" "$script.tmp"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 120 -o "$script.tmp" "https://raw.githubusercontent.com/Lascade-Co/actions/$CONTROL_SHA/scripts/kmp/bundle_cache.py"
        test -s "$script.tmp"
        mv "$script.tmp" "$script"
        python3 "$script" "$CACHE_MODE"
    - name: Report unavailable cache
      if: steps.bundle.outcome == 'failure'
      shell: bash
      run: echo '::warning::Dependency cache unavailable; consult the cache step logs. Builds resolve dependencies cold, and publishing remains best effort.'
